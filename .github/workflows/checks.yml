# The build gate the Phase 1 hardening asked for.
#
# Three jobs, deliberately separate so a failure names itself:
#   checks     - every action classified, pricing consistent, refund events handled
#   typecheck  - the Next.js app still compiles
#   deno-check - the edge functions still compile. This is not decoration: an out-of-scope `u`
#                in os_api meant Control Mode could never be opened through the API, and it was
#                invisible until `deno check` was run over the file.
name: checks

# Every PR used to run this twice: once for the branch push and once for the pull_request event,
# three jobs each time. Push is now limited to main, and pull_request covers everything else.
#
# ── AND IT STILL BURNED THE MONTH ───────────────────────────────────────────────────────────────
# Measured 9 Aug 2026 over the three days GitHub still had runs for: 192 Actions-minutes, ~64 a
# day, of which this workflow is 160 across 214 runs. A 2,000-minute allowance divided by 64 is
# 31 days, so the plan was being consumed exactly as fast as it renewed and the month ran out on
# the 9th. Two changes, neither of which costs any coverage:
#
#   paths-ignore  the three jobs are `deno check`, `tsc --noEmit` and three node scripts. None of
#                 them can be affected by a markdown file, and this repository writes a lot of
#                 markdown — handover briefs, state documents, session notes. A docs commit was
#                 paying for a full typecheck of the Next.js app.
#   concurrency   this project merges in bursts. Superseded runs on the same ref are cancelled
#                 rather than each one running to completion for a commit nobody will look at.
#                 main is excluded from cancellation on purpose: the run against what is actually
#                 deployed must finish, whatever lands after it.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# founder 26 Oct: automatic triggers off until bugs clear; re-enable push/pull_request/schedule then
on:
  # push:
    # branches: ['main']
    # paths-ignore: ['docs/**', '**/*.md', '.claude-flow/**', 'graphify-out/**']
  # pull_request:
    # paths-ignore: ['docs/**', '**/*.md', '.claude-flow/**', 'graphify-out/**']
  workflow_dispatch:

# Deno reads only the npm: specifiers the edge functions import, never the Next.js app's package.json: with
# --no-lock it resolved that whole tree fresh and failed on a platform package the registry mirror had not
# served yet ("Could not find npm package @swc/core-darwin-arm64 1.16.18", 12 Oct 2026, 5 jobs, 3 PRs).
env:
  DENO_NO_PACKAGE_JSON: "1"

jobs:
  checks:
    name: classification, pricing and refund checks
    runs-on: ${{ vars.RUNNER || 'ubicloud-standard-8' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      # 12 Oct 2026: node_modules comes from package-lock.json. Until today it came, unnoticed, from deno resolving
      # package.json with --node-modules-dir=auto (unlocked, so a fresh registry read every run); with
      # DENO_NO_PACKAGE_JSON set that stopped, and nocheck_files_have_no_redeclarations could not import typescript.
      - name: Install the locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      # 4 Aug 2026. `npm test` now runs the Deno suite as well as the Node checks, because
      # supabase/functions/_shared/attachment.test.ts had never executed once: the runner globbed
      # *.test.mjs and `deno test` appeared in no workflow. run.mjs fails HARD when deno is absent
      # rather than skipping - a suite that could not run must not be reported as one that passed -
      # so this step is load-bearing, not convenience.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Run checks
        run: npm test
      # 9 SEP 2026 — REGISTERED, at last. scripts/checks/ssrf_guard_refuses_private_addresses.mjs
      # (until today reg_fetch_refuses_private_addresses.mjs) appeared in NO workflow. reg_fetch was
      # deleted on 8 Sep and took the guard with it, so from that day the check crashed ENOENT and
      # exited 1 before its first assertion — and nothing noticed, because a check no job runs cannot
      # go red. It belongs HERE and not in project-parity.yml: it reads a committed source file, and
      # this job carries no Supabase token precisely because nothing in it needs one. It is a
      # separate step rather than a *.test.mjs so that a failure names the SSRF guard by itself
      # instead of arriving inside a suite of ninety other files.
      - name: The SSRF guard fires on a private address, a file:// URL and a metadata endpoint
        run: node scripts/checks/ssrf_guard_refuses_private_addresses.mjs
      # 22 SEP 2026 — REGISTERED WITH ITS FIRST COMMIT, having read the note above about what happens
      # when that is left for later. This is a RATCHET, not a gate: the connectivity audit counted 113
      # outbound fetches with no deadline, the baseline file holds the current number, and the step
      # fails if it RISES (new unbounded code) or if it FALLS without the baseline being tightened (a
      # ratchet nobody tightens is a ratchet that stops ratcheting). A separate step and not a
      # *.test.mjs for the same reason as the SSRF guard: a failure should name this by itself.
      - name: No new outbound fetch without a deadline
        run: node scripts/checks/every_outbound_fetch_has_a_timeout.mjs
      # 22 SEP 2026 — a DWG is READ, not pictured (founder instructions 31, 63, 64). Nine real DWGs
      # (R14 to 2018) from LibreDWG's test data, fetched at a pinned commit and checked by hash, must give
      # the same take-off as the AutoCAD-written DXF of the same drawing. It needs the network (the
      # drawings are not ours to commit, and the WASM comes from jsDelivr), which the `npm test` Deno
      # suite does not grant, so it is its own step with --allow-net limited to those two hosts.
      - name: A DWG is read into the same take-off as its DXF
        run: >-
          deno test --no-lock --node-modules-dir=auto --allow-read=.
          --allow-net=raw.githubusercontent.com,cdn.jsdelivr.net
          supabase/functions/_shared/doc_read/dwg_samples.check.ts
      # 24 SEP 2026 — THE PAGE A SUPPLIER SEES, PIXEL BY PIXEL (founder instructions 580, 703). drawing_redact
      # decodes and encodes with imagescript, whose Deno build fetches its codec .wasm from deno.land on
      # import, so this cannot run inside `npm test` (no network there). It proves every identity run of a
      # synthetic ZZ DEMO PDF sheet and 3-sheet set is under solid black, every room / tag / dimension is
      # still inked, a scan is HELD, and neither a PDF page nor a CAD drawing's JPEG carries metadata or
      # identity bytes. The drawing decisions themselves are proved offline in the npm test suite
      # (cad_render.test.ts, drawing_boq/every_drawing_format.test.ts).
      - name: A redacted drawing page covers every identity and keeps the drawing
        run: >-
          deno test --no-lock --node-modules-dir=auto --allow-read=.
          --allow-net=deno.land
          supabase/functions/_shared/drawing_redact_page.check.ts
      # 24 SEP 2026 — A SCANNED DRAWING IS REDACTED BY OCR OR HELD (founder instruction 579). The real engine
      # (tesseract.js 7.0.0 with the repository's own eng + ara data) on a synthetic ZZ DEMO scan: the title block
      # blacked out, rooms / dimensions / legend kept, a second OCR reads no identity, a title block read below
      # 70% confidence is held, a sheet with no title block is held, and the CAD worker publishes a clean page as
      # one recorded run. The engine's worker thread needs --allow-env and imagescript's codec comes from deno.land.
      - name: A scanned drawing is redacted by OCR, or held
        run: >-
          deno test --no-lock --node-modules-dir=auto --allow-read=. --allow-env
          --allow-net=deno.land
          supabase/functions/_shared/scan_redact.check.ts
      - name: A scanned PDF set is counted by OCR to the hand count (scan_takeoff.check.ts)
        run: >-
          deno test --no-lock --node-modules-dir=auto --allow-read=. --allow-env
          --allow-net=deno.land,esm.sh
          supabase/functions/_shared/scan_takeoff.check.ts

  # 8 Aug 2026. Squawk lints migration SQL for operations that take locks on a table with live
  # traffic — an index built without CONCURRENTLY, a NOT NULL column that rewrites the table, a
  # missing lock_timeout. It reads the files statically, so it needs no database and no secrets.
  #
  # It is here because of what this repo just went through: nine rounds of a migration set that
  # could not rebuild an environment, none of which any existing gate could see. This does not
  # catch that class — check_migration_order.mjs does — but it catches the next one, where a
  # migration applies cleanly and locks the leads table for four minutes during business hours.
  #
  # The two generated baseline files are excluded in .squawk.toml: they only ever run against an
  # empty database, where a warning about blocking writers is not a finding. 942 of them are not a
  # finding either, and a linter people mute is worse than no linter.
  migration-lint:
    name: lint migrations for locking operations
    runs-on: ${{ vars.RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The file list is built here rather than handed to squawk as a glob, because squawk exits 1
      # when every path it was given is excluded — indistinguishable from a lint failure, and that
      # is today's state: the only migrations present are the two generated ones. Measured, not
      # assumed; the first version of this step would have been red from the moment it landed.
      #
      # `_baseline_` is the same token .squawk.toml excludes on, so the two cannot disagree.
      - name: Squawk
        run: |
          files=$(ls supabase/migrations/*.sql 2>/dev/null | grep -v '_baseline_' || true)
          if [ -z "$files" ]; then
            echo "no hand-written migrations to lint — the generated baseline is excluded by design"
            exit 0
          fi
          echo "linting:"; echo "$files"
          npx squawk $files

  typecheck:
    name: typecheck the app
    runs-on: ${{ vars.RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # 21 Sep 2026: next 16.3.x (CRITICAL, RCE on windows hosts), postcss, sharp and nanoid (HIGH)
      # reached production and were first seen by the weekly IT reading, then fixed by #776. The weekly
      # duty finds advisories published AFTER a merge; this step refuses a PR that ships one already known.
      - name: No HIGH or CRITICAL advisory in a production dependency
        run: npm audit --omit=dev --audit-level=high

  deno-check:
    name: typecheck the edge functions
    runs-on: ${{ vars.RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      # os_api and the money paths first, because those are the ones where a compile error is a
      # silent 500 rather than a visible failure.
      #
      # 23 SEP 2026 — THE SECOND STEP NOW BLOCKS. It was advisory from the day it landed, because
      # "191 functions written over months will not all be clean on day one and a permanently red
      # gate teaches people to ignore gates". Measured today: 73 functions remain and
      # `deno check --no-lock --node-modules-dir=auto supabase/functions/*/index.ts` exits 0 over
      # every one of them. The reason for the exemption is gone, so the exemption is gone: an
      # advisory step that passes is a gate nobody is relying on, and the next type error to reach
      # a non-listed function would have merged green.
      # --node-modules-dir=auto is required, not cosmetic. There is a package.json at the repo root
      # (the Next.js app), so Deno treats this as a Node project and expects a node_modules
      # directory that a fresh checkout does not have. Without the flag it fails resolving
      # npm:@supabase/realtime-js - an environment error that says nothing about the code, which is
      # the worst kind of red build: it trains people to ignore the gate.
      # 22 SEP 2026 — a stale comment corrected. This block used to say supplier_api "was deleted on
      # 8 Sep 2026 ... the gate is narrowed to what still exists", while supplier_api is named in the
      # step below and supabase/functions/supplier_api/index.ts is 1,319 lines of the live supplier
      # portal backend. It was deleted in the 8 Sep sweep (182308b) and RESTORED the same day by
      # b573732, "The portals come back", after every button on /me and /portal 404'd for about
      # ninety minutes. The rule
      # the old comment states is still the rule — a named function that is gone comes OFF the list
      # rather than the step being softened — it simply does not apply to supplier_api.
      # os_api led this list until 9 Sep 2026, when the OS was deleted. A named function that is gone
      # must come OFF the list rather than the step being softened: leaving it makes deno check fail
      # for a reason that has nothing to do with type safety, and the usual repair for that is to stop
      # taking the step seriously.
      #
      # What replaced it is chosen on the same rule the original comment gives — the functions where a
      # compile error is a silent 500 rather than a visible failure. The money paths, the founder's
      # only command channel, and the two portal backends whose absence 404'd every button on /me and
      # /portal for ninety minutes on 8 September.
      # 9 SEP 2026 — resend_inbound and supplier_catalog_ingest ADDED, on the list's own rule.
      # Both take UNTRUSTED BYTES from outside the estate, and both now depend on shared modules
      # (_shared/safe_url.ts, _shared/attachment.ts) that until today were only advisory-checked. A
      # compile error in either is exactly the silent-500 shape this step exists for: resend_inbound
      # answers a Resend webhook, so a broken deploy drops inbound supplier documents and forwarded
      # receipts with no operator anywhere in the loop, and supplier_catalog_ingest is the first
      # caller of the SSRF guard and the sheet sanitiser the Sales Engineer's document pipeline will
      # sit on. Both were measured `deno check`-clean at the moment they were added, so this does not
      # land the step red — the failure mode the original comment warns about.
      - name: Check the gated functions
        run: deno check --no-lock --node-modules-dir=auto supabase/functions/ceo_agent/index.ts supabase/functions/stripe_webhook/index.ts supabase/functions/supplier_pay/index.ts supabase/functions/customer_api/index.ts supabase/functions/supplier_api/index.ts supabase/functions/resend_inbound/index.ts supabase/functions/supplier_catalog_ingest/index.ts
      - name: Check every other edge function
        run: deno check --no-lock --node-modules-dir=auto supabase/functions/*/index.ts

  # 6 OCT 2026 — A SIGN-IN CODE IS COUNTED AND SPENT ONCE (pre-launch security pass, H1). The committed
  # body of public.fn_login_otp_email_verify runs against a throwaway Postgres started for this job
  # (never the production project): 20 parallel wrong guesses must evaluate exactly 5, and 20 parallel
  # copies of the right code must verify exactly once. A separate job because it needs a database
  # service, which nothing else in this workflow does.
  otp-race:
    name: a sign-in code survives 5 guesses and verifies once under a burst
    runs-on: ${{ vars.RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: race
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Twenty parallel guesses against the locked verify routine
        env:
          QD_OTP_RACE_PG: postgres://postgres:race@127.0.0.1:5432/postgres
        run: >-
          deno test --no-lock --node-modules-dir=auto --allow-read --allow-write=node_modules --allow-env
          --allow-net supabase/functions/login_otp/verify_race.check.ts
