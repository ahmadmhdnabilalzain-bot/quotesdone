# The build gate the Phase 1 hardening asked for.
#
# Three jobs, deliberately separate so a failure names itself:
#   checks     - every action classified, pricing consistent, refund events handled
#   typecheck  - the Next.js app still compiles
#   deno-check - the edge functions still compile. This is not decoration: an out-of-scope `u`
#                in os_api meant Control Mode could never be opened through the API, and it was
#                invisible until `deno check` was run over the file.
name: checks

# Every PR used to run this twice: once for the branch push and once for the pull_request event,
# three jobs each time. Push is now limited to main, and pull_request covers everything else.
#
# ── AND IT STILL BURNED THE MONTH ───────────────────────────────────────────────────────────────
# Measured 9 Aug 2026 over the three days GitHub still had runs for: 192 Actions-minutes, ~64 a
# day, of which this workflow is 160 across 214 runs. A 2,000-minute allowance divided by 64 is
# 31 days, so the plan was being consumed exactly as fast as it renewed and the month ran out on
# the 9th. Two changes, neither of which costs any coverage:
#
#   paths-ignore  the three jobs are `deno check`, `tsc --noEmit` and three node scripts. None of
#                 them can be affected by a markdown file, and this repository writes a lot of
#                 markdown — handover briefs, state documents, session notes. A docs commit was
#                 paying for a full typecheck of the Next.js app.
#   concurrency   this project merges in bursts. Superseded runs on the same ref are cancelled
#                 rather than each one running to completion for a commit nobody will look at.
#                 main is excluded from cancellation on purpose: the run against what is actually
#                 deployed must finish, whatever lands after it.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: ['main']
    paths-ignore: ['docs/**', '**/*.md', '.claude-flow/**', 'graphify-out/**']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', '.claude-flow/**', 'graphify-out/**']
  workflow_dispatch:

jobs:
  checks:
    name: classification, pricing and refund checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # 4 Aug 2026. `npm test` now runs the Deno suite as well as the Node checks, because
      # supabase/functions/_shared/attachment.test.ts had never executed once: the runner globbed
      # *.test.mjs and `deno test` appeared in no workflow. run.mjs fails HARD when deno is absent
      # rather than skipping - a suite that could not run must not be reported as one that passed -
      # so this step is load-bearing, not convenience.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run checks
        run: npm test

  # 8 Aug 2026. Squawk lints migration SQL for operations that take locks on a table with live
  # traffic — an index built without CONCURRENTLY, a NOT NULL column that rewrites the table, a
  # missing lock_timeout. It reads the files statically, so it needs no database and no secrets.
  #
  # It is here because of what this repo just went through: nine rounds of a migration set that
  # could not rebuild an environment, none of which any existing gate could see. This does not
  # catch that class — check_migration_order.mjs does — but it catches the next one, where a
  # migration applies cleanly and locks the leads table for four minutes during business hours.
  #
  # The two generated baseline files are excluded in .squawk.toml: they only ever run against an
  # empty database, where a warning about blocking writers is not a finding. 942 of them are not a
  # finding either, and a linter people mute is worse than no linter.
  migration-lint:
    name: lint migrations for locking operations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The file list is built here rather than handed to squawk as a glob, because squawk exits 1
      # when every path it was given is excluded — indistinguishable from a lint failure, and that
      # is today's state: the only migrations present are the two generated ones. Measured, not
      # assumed; the first version of this step would have been red from the moment it landed.
      #
      # `_baseline_` is the same token .squawk.toml excludes on, so the two cannot disagree.
      - name: Squawk
        run: |
          files=$(ls supabase/migrations/*.sql 2>/dev/null | grep -v '_baseline_' || true)
          if [ -z "$files" ]; then
            echo "no hand-written migrations to lint — the generated baseline is excluded by design"
            exit 0
          fi
          echo "linting:"; echo "$files"
          npx squawk $files

  typecheck:
    name: typecheck the app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  deno-check:
    name: typecheck the edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # os_api and the money paths first, because those are the ones where a compile error is a
      # silent 500 rather than a visible failure. The remaining functions follow; a failure here
      # does not block, because 191 functions written over months will not all be clean on day one
      # and a permanently red gate teaches people to ignore gates.
      # --node-modules-dir=auto is required, not cosmetic. There is a package.json at the repo root
      # (the Next.js app), so Deno treats this as a Node project and expects a node_modules
      # directory that a fresh checkout does not have. Without the flag it fails resolving
      # npm:@supabase/realtime-js - an environment error that says nothing about the code, which is
      # the worst kind of red build: it trains people to ignore the gate.
      - name: Check the gated functions
        run: deno check --no-lock --node-modules-dir=auto supabase/functions/os_api/index.ts supabase/functions/stripe_webhook/index.ts supabase/functions/supplier_api/index.ts supabase/functions/supplier_pay/index.ts
      - name: Check every other edge function (advisory)
        continue-on-error: true
        run: deno check --no-lock --node-modules-dir=auto supabase/functions/*/index.ts
