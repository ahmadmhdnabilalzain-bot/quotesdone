name: Dropbox backup second scheduler

# The founder, 14 Sep 2026: "we need to eliminate all other causes with fixes". A document reaches
# Dropbox the moment it lands (the database kicks dropbox_backup through pg_net) and resilience_ping
# catches up every 15 minutes. This run is the third path and the only one outside Supabase and
# Vercel: every six hours it asks the database to kick the backup again, so a stopped Vercel Cron or
# a lost pg_net request delays a document by at most six hours instead of losing it.
# Cost: ~1 Actions-minute per run, 4 a day, ~120 a month. Owner: sales_engineer.

# founder 26 Oct (ledger 1279) switched every automatic trigger off; founder 28 Oct (ledger 1410): "activate github actions",
# on GitHub-hosted runners. push / pull_request / workflow_run are back; schedules stay on pg_cron (moved 26 Oct, no double run).
# founder 10 Nov (ledger 1564): GitHub Actions off, its budget is spent; a Claude session runs checks, applies and deploys
on:
  # schedule:
    # - cron: '41 */6 * * *'
  workflow_dispatch: {}

concurrency:
  group: dropbox-backup-second-scheduler
  cancel-in-progress: false

jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Ask the database to kick dropbox_backup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/backup/kick_dropbox_backup.mjs
