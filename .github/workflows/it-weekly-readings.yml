name: IT engineer weekly readings

# Duties 9 (database backups / PITR), 12 (dependency advisories), 13 (Supabase members) and 14 (disk
# size): the readings that need a Supabase management token or the repository itself. Each report
# goes to a database function that decides; nothing here changes code or configuration.
#
# Uses the repository secret SUPABASE_ACCESS_TOKEN (present since 7 Sep 2026). If it were ever missing
# the job skips with a notice, and the IT engineer raises the missing readings itself after eight days
# (fn_it_workflow_heartbeats).

on:
  schedule:
    - cron: '30 4 * * 1'   # Mondays 08:30 Dubai
  workflow_dispatch: {}

# Duty 23 (14 Sep 2026): the last step may open ONE pull request, lockfile only, for an independent review.
# It never merges; these two permissions let it push that branch and open that PR, nothing else.
# Workflow level grants nothing; the one job below asks for exactly what it uses (Aikido, 19 Oct 2026).
permissions: {}

jobs:
  readings:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ${{ vars.RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set; the IT engineer reports the missing readings itself"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != '1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true   # this job pushes (git push / gh pr create)
      - if: steps.gate.outputs.skip != '1'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - if: steps.gate.outputs.skip != '1'
        run: npm ci
      - if: steps.gate.outputs.skip != '1'
        run: node scripts/it/report_dependency_audit.mjs
      - if: steps.gate.outputs.skip != '1'
        run: node scripts/it/report_platform_readings.mjs
      # Duty 23: the safe patch, after the audit has reported. A patch it cannot make is recorded, not failed.
      # The commit is authored as the repository owner's account, NOT a separate "it-engineer" identity
      # (21 Sep 2026): Vercel builds a branch only when the commit author is on the Vercel team, so PR
      # #768 (author it-engineer@users.noreply.github.com) could not deploy and Vercel emailed the
      # founder asking to add a paid seat. The seat is still named — every commit message starts
      # "it_engineer:" (open_dependency_patch_pr.mjs). This step used to appear twice; once is enough.
      - if: steps.gate.outputs.skip != '1'
        run: |
          git config user.name "ahmadmhdnabilalzain-bot"
          git config user.email "286641016+ahmadmhdnabilalzain-bot@users.noreply.github.com"
          node scripts/it/open_dependency_patch_pr.mjs
