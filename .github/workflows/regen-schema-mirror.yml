name: Regenerate the schema mirror on a branch

# supabase/schema/full_schema is read from production, which needs the management token that only Actions holds.
# Runs by hand, or once when this file changes on a branch. Never writes to main: a mirror lands by PR.
# founder 10 Nov (ledger 1564): GitHub Actions off, its budget is spent; a Claude session runs checks, applies and deploys
on:
  workflow_dispatch:
  # push:
  #   paths:
  #     - .github/workflows/regen-schema-mirror.yml

permissions:
  contents: write

jobs:
  regen:
    if: ${{ github.ref_name != 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
        timeout-minutes: 8
      - run: node scripts/checks/export_from_either_source_is_identical.mjs --write
      - name: Commit the mirror to this branch
        run: |
          git add supabase/schema/full_schema
          git diff --cached --quiet && exit 0
          # a verified GitHub identity, or Vercel refuses to deploy the commit
          git config user.name "ahmadmhdnabilalzain-bot"
          git config user.email "286641016+ahmadmhdnabilalzain-bot@users.noreply.github.com"
          git commit -m "it_engineer: regenerate the schema mirror from production"
          git push origin "HEAD:${GITHUB_REF_NAME}"
