name: CAD read worker

# A CAD drawing the edge could not read inside its 2 s CPU / memory caps is read here, with the same
# reader code (scripts/cad_read_worker.ts, 22 Sep 2026, founder: "customer will share cad files or pdf
# mainly"). THE QUEUE TRIGGERS IT: customer_api dispatches this workflow the moment it queues a job in
# public.cad_read_jobs, and again while the customer's screen polls a job that has not started (a lost
# dispatch) or whose runner went silent (fn_cad_read_claim takes such a job back after 30 minutes): at most
# once a minute per job, for its first hour (customer_api cad_dispatch.ts). Owner: sales_engineer.
# 27 Oct 2026 (it_engineer, #1605): Actions was OFF, the dispatch was removed and a queued job raised a
# sales_engineer finding instead. 3 Nov 2026 (sales_engineer, #1837): Actions is on again (ledger 1410), so
# customer_api dispatches this workflow again (startCadWorker). A dispatch that does not answer 204, or a job not
# started within an hour, still raises that finding (customer_api cadReadHeld), and the sales_engineer can run the
# same command as the step below by hand. The dispatch needs app_secrets.github_token to carry Actions: write
# (it_engineer finding it_engineer:github_token_actions_write_unconfirmed).
# The 6-hourly schedule (below, commented out) was the last resort for a lost dispatch after the customer closed the
# page. With it off (schedules live on pg_cron since 26 Oct) that case is NOT seen: a dispatch answered 204 whose run
# never starts, with no page polling, raises nothing until someone reads cad_read_jobs.

# founder 26 Oct (ledger 1279) switched every automatic trigger off; founder 28 Oct (ledger 1410): "activate github actions",
# on GitHub-hosted runners. push / pull_request / workflow_run are back; schedules stay on pg_cron (moved 26 Oct, no double run).
on:
  # schedule:
    # - cron: '17 */6 * * *'
  workflow_dispatch: {}

concurrency:
  # Two runners at once are safe (SKIP LOCKED) but buy nothing; a second dispatch waits for the first.
  group: cad-read-worker
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    # 75 (was 40): a scanned drawing is OCR'd eight times a page since 25 Sep 2026, up to 30 minutes a job
    # (scripts/cad_read_worker.ts SCAN_JOB_MS).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Read the queued CAD drawings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: deno run --no-lock --node-modules-dir=auto --allow-net --allow-env --allow-read scripts/cad_read_worker.ts
