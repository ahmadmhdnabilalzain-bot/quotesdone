name: CAD read worker

# A CAD drawing the edge could not read inside its 2 s CPU / memory caps is read here, with the same
# reader code (scripts/cad_read_worker.ts, 22 Sep 2026, founder: "customer will share cad files or pdf
# mainly"). THE QUEUE TRIGGERS IT: customer_api dispatches this workflow the moment it queues a job in
# public.cad_read_jobs, and again while the customer's screen polls a job that has not started (a lost
# dispatch) or whose runner went silent (fn_cad_read_claim takes such a job back after 30 minutes).
# The schedule stays ONLY for what nothing else can see: a lost dispatch or a dead runner after the
# customer closed the page - without it that drawing would never be read. 4 runs a day, ~120 Actions-
# minutes a month, plus ~1 minute per queued drawing. Owner: sales_engineer.
# 27 Oct 2026 (it_engineer): GitHub Actions is OFF, so nothing triggers this file. customer_api no longer dispatches it;
# a queued job raises a sales_engineer finding instead (customer_api cadReadHeld), and the sales_engineer runs the same
# command as the step below by hand. The Claude cloud routine "CAD read worker" (every 2 h at :15, runbook
# docs/runbooks/release-without-ci.md section 3) runs the same command but is PAUSED: founder, no customer drawings
# until customers are invited. This file stays as the record of how the worker runs when Actions returns.

# founder 26 Oct (ledger 1279) switched every automatic trigger off; founder 28 Oct (ledger 1410): "activate github actions",
# on GitHub-hosted runners. push / pull_request / workflow_run are back; schedules stay on pg_cron (moved 26 Oct, no double run).
on:
  # schedule:
    # - cron: '17 */6 * * *'
  workflow_dispatch: {}

concurrency:
  # Two runners at once are safe (SKIP LOCKED) but buy nothing; a second dispatch waits for the first.
  group: cad-read-worker
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    # 75 (was 40): a scanned drawing is OCR'd eight times a page since 25 Sep 2026, up to 30 minutes a job
    # (scripts/cad_read_worker.ts SCAN_JOB_MS).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Read the queued CAD drawings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: deno run --no-lock --node-modules-dir=auto --allow-net --allow-env --allow-read scripts/cad_read_worker.ts
