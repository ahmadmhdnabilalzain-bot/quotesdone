name: CAD read worker

# A CAD drawing the edge could not read inside its 2 s CPU / memory caps is read here, with the same
# reader code (scripts/cad_read_worker.ts, 22 Sep 2026, founder: "customer will share cad files or pdf
# mainly"). customer_api dispatches this workflow the moment it queues a job in public.cad_read_jobs; the
# schedule is the safety net for a lost dispatch, and fn_cad_read_claim takes back a job whose runner died.
# Cost (private repository, ~1 Actions-minute per run): the schedule is 8 runs a day, ~240 minutes a
# month, plus one run per queued drawing. Owner: sales_engineer.

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch: {}

concurrency:
  # Two runners at once are safe (SKIP LOCKED) but buy nothing; a second dispatch waits for the first.
  group: cad-read-worker
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Read the queued CAD drawings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: deno run --no-lock --node-modules-dir=auto --allow-net --allow-env --allow-read scripts/cad_read_worker.ts
