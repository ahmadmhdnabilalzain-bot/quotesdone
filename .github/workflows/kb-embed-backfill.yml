# THE KNOWLEDGE BACKFILL NEEDS A CALLER THAT CAN RUN FOR MINUTES.
#
# The founder, 9 Sep 2026: "The general reference library, you need to organize it in a way that
# it's ingested properly, not just like a text... It has to be like a brain."
#
# The pipeline was rebuilt the same day and is 15.8x faster than the pg_cron path it replaces
# (531 rows/min measured over 27 cycles, against 33.7/min before). What it does NOT have is a
# scheduler that can drive it.
#
# WHY NOT resilience_ping. That is the company's only heartbeat and the obvious home, and it was
# tried first. It does not work, for a measured reason: PostgREST runs RPC calls as `authenticator`,
# which carries `statement_timeout=8s`, and fn_kb_embed_dispatch queues one net.http_post per chunk
# at ~337ms each. Fifty rows took 16.9 seconds and the tick returned
# "canceling statement due to statement timeout". Inside 8 seconds it can place about 23 rows —
# 96 ticks a day is 2,208 rows, and 2.5 million rows would take a little over three years.
#
# So the 15-minute tick is the wrong shape for this work, and a GitHub Action is the right one:
# it can hold a connection for half an hour, it already holds SUPABASE_ACCESS_TOKEN, and this
# estate already uses it as its second scheduler. At 531/min a 30-minute run places ~16,000 rows,
# and the remaining backlog drains in roughly three and a half days of daily runs.
#
# The embedding itself is free and in-region (Supabase.ai gte-small via ai_gateway). Nothing here
# touches OpenRouter, which is on hold.

name: kb embedding backfill

on:
  schedule:
    # 02:20 UTC = 06:20 Dubai, before the working day, so the embedder is not competing with
    # customer traffic on the same edge functions.
    - cron: '20 2 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How long to run for'
        required: false
        default: '30'
      max_tier:
        description: 'Highest priority tier to include (1 = the fit-out trades we actually sell)'
        required: false
        default: '4'

concurrency:
  # Two backfills at once would double-dispatch the same chunks. The claim is idempotent, but a
  # second runner buys nothing and doubles the edge invocations.
  group: kb-embed-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: embed the highest-demand chunks first
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node scripts/kb/run_embed_backfill.mjs \
            --minutes=${{ github.event.inputs.minutes || '30' }} \
            --max-tier=${{ github.event.inputs.max_tier || '4' }} \
            --batch=400

      - name: report where the corpus now stands
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          node -e "
          const t = process.env.SUPABASE_ACCESS_TOKEN;
          fetch('https://api.supabase.com/v1/projects/htdblwldjkcgjvmqkbeh/database/query', {
            method: 'POST',
            headers: { Authorization: 'Bearer ' + t, 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: \"select count(*) filter (where embedding_gte is not null) embedded, count(*) total from public.kb_chunks\" }),
          }).then(r => r.json()).then(j => {
            const { embedded, total } = j[0];
            const pct = (embedded / total * 100).toFixed(2);
            console.log('embedded ' + embedded + ' of ' + total + ' (' + pct + '%)');
            console.log('remaining ' + (total - embedded));
          });"
