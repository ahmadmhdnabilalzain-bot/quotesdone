name: Supplier document walk (demo data)

# Founder ledger 1442, 1457, 1467, 1468: a supplier's real files, through the portal's own form in a real browser on the
# live site, to a decision, and permanently on GitHub so no session has to be open. ZZ DEMO leads at @example.invalid
# only; teardown removes the run by its tag. Runs on push of its own two paths (as a workflow not yet on main cannot be
# dispatched) and on dispatch once it is.
on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/workflows/supplier-document-walk.yml'
      - 'scripts/e2e/supplier_document_read_walk.mjs'

jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      QD_FIXTURES: '1'
      QD_E2E_RUN_TAGS: e2e-run-tags.txt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install the locked dependencies and the browser
        run: npm ci && npx playwright install --with-deps chromium
        timeout-minutes: 8
      - name: Walk the supplier's documents
        run: node scripts/e2e/supplier_document_read_walk.mjs --browser --case t_text_pdf,t_scanned_pdf,t_png,t_jpg,t_blank_pdf,t_wrong_company,t_expired --json walk.json --shots walk-shots
        timeout-minutes: 30
      # Runs even when the walk failed or was cancelled; touches only the tags this job wrote.
      - name: Close this job's rehearsal windows
        if: always()
        run: node scripts/e2e/close_job_windows.mjs "$QD_E2E_RUN_TAGS"
      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supplier-document-walk
          path: |
            walk.json
            walk-shots
          if-no-files-found: warn
