name: Marketing asset features

# The marketing seat's deterministic measurement of its own videos (build item 6; founder instructions 865, 867).
# Owner: marketing. An edge function cannot run ffmpeg, so this runs here with ubuntu's own ffmpeg and tesseract
# packages and writes public.marketing_asset_feature through fn_marketing_asset_feature_record, uploading key frames
# to marketing-media/features/<sha>/. Weekly (new masters are few) and on dispatch after a campaign upload.
# A PULL REQUEST GETS NO SECRETS: it proves determinism on a synthetic fixture made in the job (picture, captions and
# a tone), measured twice. Only a push to main's schedule or a dispatch reads production.
# Cost: ~3 Actions-minutes per run for 12 videos; no model call, no paid API.

on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'scripts/media/**'
      - '.github/workflows/marketing-asset-features.yml'

permissions:
  contents: read

concurrency:
  group: marketing-asset-features-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the media toolchain (ubuntu packages)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg tesseract-ocr unzip
      - name: Parser tests
        run: node --test scripts/media/measure_marketing_assets.test.mjs
      - name: Prove determinism on a fixture (no secrets)
        if: github.event_name == 'pull_request'
        run: |
          ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc2=size=1080x1920:rate=30:duration=6" \
            -f lavfi -i "sine=frequency=440:duration=6" \
            -vf "drawtext=text='ZZ DEMO FIXTURE':fontsize=96:fontcolor=white:x=(w-tw)/2:y=h/3" \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest -y "$RUNNER_TEMP/fixture.mp4"
          node scripts/media/measure_marketing_assets.mjs --fixture="$RUNNER_TEMP/fixture.mp4"
      - name: Measure and record every video
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/media/measure_marketing_assets.mjs --check-determinism --write
