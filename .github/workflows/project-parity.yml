# "Both projects" was a claim this estate made constantly and had never counted. On 2026-08-10 the
# first count found 602 objects of drift: one table, six triggers, 127 cron jobs, four tables with
# RLS off, and 464 SECURITY DEFINER functions that STAGING's anon role could execute and
# production's could not. All of it was closed, and this workflow existed so it could not silently
# come back.
#
# 15 AUG 2026 — THE SUBJECT CHANGED, THE JOB DID NOT. Staging (pglpqrhvozwepymcuunn) was deleted at
# the founder's instruction, so `scripts/checks/project_parity.mjs` no longer had two projects to
# compare and was retired with it (see docs/agents/RETIRED_TWO_PROJECT_CHECKS.md).
#
# 17 AUG 2026 — THE SELECTION MECHANISM CHANGED. The final Phase C acceptance found
# sql_files_match_live certifying the WRONG deployed body: it ranks files by GIT COMMIT TIME, and on
# a tie inside one commit it accepts live matching ANY candidate. operations_assistance_company_
# reports.sql and operations_company_remaining_lists.sql both define fn_ws_operations and
# fn_ws_company with different bodies, in one commit, and the check printed 0 drift either way.
#
# scripts/checks/canonical_routine_manifest.mjs replaces it. One canonical file per routine, chosen
# by an EXPLICIT sequence — migration version, then position in scripts/sql/MANIFEST.txt — never by
# a timestamp. Two files at one sequence key is itself a failure, so no tie is ever broken by a
# guess. It measures both directions plus uncommitted application DDL.
#
# ON EVERY PULL REQUEST as well as daily. The repository-side half — conflicting definitions,
# ambiguous winners, manifest gaps — needs no database and is exactly what a PR can introduce; it
# runs and asserts even without the token. The production halves say plainly that they asserted
# nothing when the token is absent, rather than passing quietly.
name: repo and database agree

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

jobs:
  # 17 AUG 2026 — THE CROSSWALK, IN TWO JOBS ON PURPOSE.
  #
  # rc4_execution_and_trace_are_atomic.sql registered two runtime components on production and did
  # not extend docs/phase-c/PHASE_C_RUNTIME_COMPONENT_CROSSWALK.csv. Production held 1801 rows, the
  # committed crosswalk 1799, and no CI job could see it: the only check that compares them needs a
  # management token, and it skipped without one and exited 0.
  #
  # The static job below needs NO credential and runs on every pull request: a declaration with no
  # crosswalk row is exactly what a PR introduces, and that half is decidable from committed files
  # alone. The production comparison lives in the secure job with the token, is asked for with
  # --require-live, and returns NOT_VERIFIED_MISSING_MANAGEMENT_CREDENTIAL — never PASS, never
  # SKIPPED — if the secret is ever unavailable.
  crosswalk-static:
    name: every declared component is in the committed crosswalk (no credential needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Committed declarations agree with the committed crosswalk
        run: node scripts/checks/phase_c_component_crosswalk.test.mjs --static

  parity:
    name: the database is running what this repository says
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No npm install: every check here uses fetch and node:fs only.
      - name: The committed crosswalk is what production actually holds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/checks/phase_c_component_crosswalk.test.mjs --require-live
      - name: One canonical file per routine, and it is what is deployed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/checks/canonical_routine_manifest.mjs --all
      # 17 AUG 2026 — THE `if:` IS GONE. It read
      #     if: ${{ github.event_name != 'pull_request' }}
      # so this step ran only AFTER a merge, where nothing gates on it. The independent acceptance
      # found the job red on main for at least three consecutive pushes while every Phase C
      # correction PR merged green: the committed mirror was 1,898 lines behind production and did
      # not carry the kernel_adapter_failure objects at all. A parity check that cannot block a
      # merge is a report, not a gate.
      - name: The schema export matches the committed schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/checks/export_from_either_source_is_identical.mjs

  # ============================================================================================
  # THE PHASE C GATE, RUN FOR REAL ON EVERY PULL REQUEST.
  #
  # 17 AUG 2026 — WHY THIS JOB EXISTS. Seven Phase C checks answer "no management token" with
  #   console.log('SKIP …'); process.exit(0)
  # and the `checks` workflow, which runs `npm test`, has no `env:` block at all. So on every pull
  # request the entire Phase C kernel gate printed SKIP and went green without asking production a
  # single question. The independent acceptance re-ran all seven WITH the credential and they pass —
  # but "they pass when a human remembers to run them locally" is not a gate.
  #
  # They run HERE rather than inside `npm test` because this workflow already holds the credential,
  # and because they run one after another: the same acceptance measured ten false failures from
  # `429 ThrottlerException` when the suite ran them in parallel against the management API.
  #
  # 18 AUG 2026 — THE WATCHER WAS NOT WATCHED. kernel_boards_are_green.test.mjs was added to close
  # the finding that six of the seven kernel boards were read by no test and no CI job. It is
  # discovered by `npm test`, which the `checks` workflow runs — and `checks` carries no `env:`
  # block, so with no SUPABASE_ACCESS_TOKEN the whole file answers `t.skip('no management token')`
  # and CI went green having asked production nothing. Exactly the defect it was written to fix,
  # reproduced by the fix. It is in the list below now, where the credential is.
  #
  # ANY NEW CHECK THAT NEEDS PRODUCTION BELONGS IN THIS LIST. A check that needs the credential and
  # is not named here does not run in CI; it runs when somebody remembers, which is not a gate.
  #
  # Every one of these probes ends in `raise exception`, so nothing is left on production.
  # ============================================================================================
  phase-c:
    name: the Phase C kernel gate, against production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: The Phase C checks that CI could not see
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NO_PAID_AI: 'true'
          OPENROUTER_DISABLED: 'true'
          AI_PROVIDER_MODE: 'mock'
        run: |
          # Deliberately no `set -e`: the exit code of each check is read into $code and acted on
          # below. With `set -e` the shell would leave before $? could be captured, and a failing
          # check would end the job without ever printing which one it was.
          for t in phase_c_founder_chain \
                   phase_c_command_acceptance \
                   phase_c_command_center_entry_point \
                   phase_c_invariants \
                   kernel_invariants \
                   kernel_positive_controls \
                   phase_c_guards_reject_injected_defects \
                   kernel_write_guard_both_directions \
                   cancellation_reaches_the_kernel \
                   active_signal_types_are_executable \
                   kernel_boards_are_green \
                   every_discharge_claim_reaches_its_table \
                   application_source_of_truth; do
            echo "::group::$t"
            out=$(node "scripts/checks/$t.test.mjs" 2>&1); code=$?
            echo "$out"
            echo "::endgroup::"
            # A SKIP here is a failure, not a pass: this job exists because the credential is present.
            if echo "$out" | grep -qE '^SKIP|^SKIPPED|NOT_VERIFIED_MISSING_MANAGEMENT_CREDENTIAL'; then
              echo "::error::$t skipped for want of a credential in the one job that has one."
              exit 1
            fi
            [ "$code" = "0" ] || { echo "::error::$t exited $code"; exit "$code"; }
          done
