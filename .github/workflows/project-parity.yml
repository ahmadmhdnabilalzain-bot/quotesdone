# "Both projects" was a claim this estate made constantly and had never counted. On 2026-08-10 the
# first count found 602 objects of drift: one table, six triggers, 127 cron jobs, four tables with
# RLS off, and 464 SECURITY DEFINER functions that STAGING's anon role could execute and
# production's could not. All of it was closed, and this workflow existed so it could not silently
# come back.
#
# 15 AUG 2026 — THE SUBJECT CHANGED, THE JOB DID NOT. Staging (pglpqrhvozwepymcuunn) was deleted at
# the founder's instruction, so `scripts/checks/project_parity.mjs` no longer had two projects to
# compare and was retired with it (see docs/agents/RETIRED_TWO_PROJECT_CHECKS.md). Note which side
# the 464 anon-executable functions were on: staging's. Deleting staging closed that finding by
# construction rather than leaving it open.
#
# What replaces it is the same question asked of the one project that exists — is the code in this
# repository the code that is actually running? — which is the drift that can still happen, because
# it arrives from applying SQL by hand rather than from merging a branch.
#
#   sql_files_match_live      : every routine in scripts/sql vs its live prosrc (349 at last run)
#   export_from_either_source : the database's own schema export vs supabase/schema/full_schema.sql
#
# DAILY RATHER THAN PER-PR, for the reason it always was: these read the live database, and drift
# does not arrive on a merge.
name: repo and database agree

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

jobs:
  parity:
    name: the database is running what this repository says
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # sql_files_match_live ranks files by git commit time
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No npm install: both checks use fetch and node:fs only.
      - name: Every routine in scripts/sql is what is live
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/checks/sql_files_match_live.test.mjs
      - name: The schema export matches the committed schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/checks/export_from_either_source_is_identical.mjs
