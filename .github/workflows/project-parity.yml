# "Both projects" was a claim this estate made constantly and had never counted. On 2026-08-10 the
# first count found 602 objects of drift: one table, six triggers, 127 cron jobs, four tables with
# RLS off, and 464 SECURITY DEFINER functions that STAGING's anon role could execute and
# production's could not. All of it was closed, and this workflow existed so it could not silently
# come back.
#
# 15 AUG 2026 — THE SUBJECT CHANGED, THE JOB DID NOT. Staging (pglpqrhvozwepymcuunn) was deleted at
# the founder's instruction, so `scripts/checks/project_parity.mjs` no longer had two projects to
# compare and was retired with it (see docs/agents/RETIRED_TWO_PROJECT_CHECKS.md).
#
# 17 AUG 2026 — THE SELECTION MECHANISM CHANGED. The final Phase C acceptance found
# sql_files_match_live certifying the WRONG deployed body: it ranks files by GIT COMMIT TIME, and on
# a tie inside one commit it accepts live matching ANY candidate. operations_assistance_company_
# reports.sql and operations_company_remaining_lists.sql both define fn_ws_operations and
# fn_ws_company with different bodies, in one commit, and the check printed 0 drift either way.
#
# scripts/checks/canonical_routine_manifest.mjs replaces it. One canonical file per routine, chosen
# by an EXPLICIT sequence — migration version, then position in scripts/sql/MANIFEST.txt — never by
# a timestamp. Two files at one sequence key is itself a failure, so no tie is ever broken by a
# guess. It measures both directions plus uncommitted application DDL.
#
# ON EVERY PULL REQUEST as well as daily. The repository-side half — conflicting definitions,
# ambiguous winners, manifest gaps — needs no database and is exactly what a PR can introduce; it
# runs and asserts even without the token. The production halves say plainly that they asserted
# nothing when the token is absent, rather than passing quietly.
name: repo and database agree

# 3 SEP 2026 — ONE RUN PER PULL REQUEST HEAD. This workflow takes ~10 minutes against production
# and carried no concurrency group, so when a fix was pushed while the previous head was still
# running, the superseded run kept going, failed on a commit that no longer existed on the branch,
# and emailed the founder a failure for it — six of eight failure emails on 3 Sep 2026 were of
# that kind. A superseded PR run is now cancelled (a cancelled run sends no failure email); main
# and the daily schedule are never cancelled, because there the old run is still the truth.
concurrency:
  group: repo-and-database-agree-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:

jobs:
  # 17 AUG 2026 — THE CROSSWALK, IN TWO JOBS ON PURPOSE.
  #
  # rc4_execution_and_trace_are_atomic.sql registered two runtime components on production and did
  # not extend docs/phase-c/PHASE_C_RUNTIME_COMPONENT_CROSSWALK.csv. Production held 1801 rows, the
  # committed crosswalk 1799, and no CI job could see it: the only check that compares them needs a
  # management token, and it skipped without one and exited 0.
  #
  # The static job below needs NO credential and runs on every pull request: a declaration with no
  # crosswalk row is exactly what a PR introduces, and that half is decidable from committed files
  # alone. The production comparison lives in the secure job with the token, is asked for with
  # --require-live, and returns NOT_VERIFIED_MISSING_MANAGEMENT_CREDENTIAL — never PASS, never
  # SKIPPED — if the secret is ever unavailable.
  # 3 SEP 2026 — THE CROSSWALK MIRROR IS RETIRED (docs/agents/RETIRED_MIRROR_GATES.md). The
  # component registry lived three times — SQL literals, a committed CSV, the live table — and the
  # copies were right only on the day they were emitted. The properties the mirror defended are
  # asserted against production itself by phase_c_components_are_owned, in the token-holding job.
  parity:
    name: the database is running what this repository says
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No npm install: every check here uses fetch and node:fs only.
      - name: Every runtime component is owned, and every live entry point is a component
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node --test scripts/checks/phase_c_components_are_owned.test.mjs
      - name: A forwarded receipt is booked or owned by finance, never waiting on the founder
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node --test scripts/checks/receipts_never_wait_on_the_founder.test.mjs
      - name: One canonical file per routine, and it is what is deployed
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/checks/canonical_routine_manifest.mjs --all
      # 17 AUG 2026 — THE `if:` IS GONE. It read
      #     if: ${{ github.event_name != 'pull_request' }}
      # so this step ran only AFTER a merge, where nothing gates on it. The independent acceptance
      # found the job red on main for at least three consecutive pushes while every Phase C
      # correction PR merged green: the committed mirror was 1,898 lines behind production and did
      # not carry the kernel_adapter_failure objects at all. A parity check that cannot block a
      # merge is a report, not a gate.
      - name: The schema export matches the committed schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/checks/export_from_either_source_is_identical.mjs
      # LAUNCH STEP 1 — the four org signal paths, proven against production on every PR. It needs the
      # credential, so per the rule above it belongs in a token-holding job or it "runs when somebody
      # remembers, which is not a gate". Every write is an aborted-transaction probe (RAISE rolls it
      # back — verified: 0 residue), it calls no model, and it retries a bare 429 so a concurrent
      # management-API job cannot fail it falsely.
      - name: The org connects like a real company (cascade, messaging, approval, escalation)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NO_PAID_AI: 'true'
          OPENROUTER_DISABLED: 'true'
        run: node scripts/checks/org_connectivity_signal_path.test.mjs
      # The adversarial companion: org-wide invariants (every role, every department) + the refusal
      # cases (an empty department, an incomplete contract, a wrong approver, a refund by an AI, an
      # unmeasurable goal). Same aborted-tx discipline, zero residue, no model.
      - name: The org connectivity is correct under pressure (refusals + org-wide invariants)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NO_PAID_AI: 'true'
          OPENROUTER_DISABLED: 'true'
        run: node scripts/checks/org_connectivity_scenarios.test.mjs

  # ============================================================================================
  # THE KERNEL AND HANDLER GATE, RUN FOR REAL ON EVERY PULL REQUEST.
  #
  # 17 AUG 2026 — WHY THIS JOB EXISTS. Seven Phase C checks answer "no management token" with
  #   console.log('SKIP …'); process.exit(0)
  # and the `checks` workflow, which runs `npm test`, has no `env:` block at all. So on every pull
  # request the entire kernel gate printed SKIP and went green without asking production a single
  # question. "They pass when a human remembers to run them locally" is not a gate.
  #
  # They run HERE rather than inside `npm test` because this workflow already holds the credential,
  # and because they run one after another: the same acceptance measured ten false failures from
  # `429 ThrottlerException` when the suite ran them in parallel against the management API.
  #
  # 18 AUG 2026 — THE WATCHER WAS NOT WATCHED. kernel_boards_are_green.test.mjs was added to close
  # the finding that six of the seven kernel boards were read by no test and no CI job. It is
  # discovered by `npm test`, which the `checks` workflow runs — and `checks` carries no `env:`
  # block, so with no SUPABASE_ACCESS_TOKEN the whole file answers `t.skip('no management token')`
  # and CI went green having asked production nothing. It is in the list below now, where the
  # credential is.
  #
  # ANY NEW CHECK THAT NEEDS PRODUCTION BELONGS IN THIS LIST. A check that needs the credential and
  # is not named here does not run in CI; it runs when somebody remembers, which is not a gate.
  #
  # 4 SEP 2026 — PHASE E (MASTER_PLAN §5.1 / §6): THE ACCEPTANCE DRIVES ARE RETIRED, THE PROPERTIES
  # STAY, AND THE TWO JOBS ARE ONE. docs/agents/RETIRED_PHASE_DRIVES.md names every check that left
  # and why. What runs here is what production must be TRUE about — a guard refuses, a door opens, a
  # board is green, an owner exists, a failed run has a reader — plus the two living-handler checks
  # the plan keeps by name (phase_d_dispatch_reaches_executed, phase_d_object_record_has_a_contract)
  # and the read-only input-contract controls beside them. The Phase D job that used to follow this
  # one through `needs: phase-c` is gone with the deliverable builders that drove production to
  # reproduce a committed CSV; the three Phase D keepers run at the END of this same serial list.
  #
  # WHY THE LIST IS STILL SERIAL. kernel_positive_controls and phase_d_dispatch_reaches_executed both
  # open a committed Phase D scenario against the one production database, in aborted transactions,
  # and fn_phase_d_committed_scenario_open refuses a second concurrent OPEN by design. One list, one
  # after another, is what keeps that door's refusal from reading as a red build. (The parity job
  # above runs in parallel with this one: nothing in it opens a scenario.) The `--test-concurrency=1`
  # in scripts/checks/run.mjs is a different thing — the management API's 429 budget — and stays.
  #
  # Every one of these probes either only reads, or ends in `raise exception`, so nothing is left on
  # production.
  # ============================================================================================
  kernel-gate:
    name: the kernel and handler gate, against production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: The production checks CI could not see
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NO_PAID_AI: 'true'
          OPENROUTER_DISABLED: 'true'
          AI_PROVIDER_MODE: 'mock'
        run: |
          # Deliberately no `set -e`: the exit code of each check is read into $code and acted on
          # below. With `set -e` the shell would leave before $? could be captured, and a failing
          # check would end the job without ever printing which one it was.
          for t in kernel_invariants \
                   kernel_positive_controls \
                   phase_c_guards_reject_injected_defects \
                   kernel_write_guard_both_directions \
                   cancellation_reaches_the_kernel \
                   active_signal_types_are_executable \
                   company_is_fully_wired \
                   kernel_boards_are_green \
                   every_discharge_claim_reaches_its_table \
                   application_source_of_truth \
                   anon_cannot_execute_security_definer \
                   a_failed_scheduled_run_has_a_reader \
                   phase_d_dispatch_reaches_executed \
                   phase_d_input_schemas_are_typed_and_closed \
                   phase_d_object_record_has_a_contract; do
            echo "::group::$t"
            # STREAMED, NOT CAPTURED. 26 Aug 2026: this job failed at its last check and the log
            # carried NOT ONE LINE of that check's output -- in a step that had run for eight minutes.
            # tee writes it as it happens and keeps a copy for the SKIP test below, and PIPESTATUS
            # keeps the check's exit code rather than tee's.
            node "scripts/checks/$t.test.mjs" 2>&1 | tee "/tmp/check-$t.log"; code=${PIPESTATUS[0]}
            out=$(cat "/tmp/check-$t.log")
            echo "::endgroup::"
            # A SKIP here is a failure, not a pass: this job exists because the credential is present.
            # node:test prints a skip as `﹣ name # SKIPPED: reason`, hence the last alternative.
            if echo "$out" | grep -qE '^SKIP|^SKIPPED|NOT_VERIFIED_MISSING_MANAGEMENT_CREDENTIAL|# SKIPPED'; then
              echo "::error::$t skipped for want of a credential in the one job that has one."
              exit 1
            fi
            [ "$code" = "0" ] || { echo "::error::$t exited $code"; exit "$code"; }
          done
