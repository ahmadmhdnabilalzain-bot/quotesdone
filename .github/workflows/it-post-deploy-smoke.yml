name: IT engineer post-deploy smoke

# Duty 16 (founder, 14 Sep 2026: "yea add them"). After every merge to main whose edge-function deploy
# succeeded, wait for Vercel's production deployment of the same commit, run a short harness journey
# on demo data (sign in, portal overview, one request, one quote, the comparison PDF in en and ar),
# purge it, and hand the result to fn_it_smoke_ingest with the merge's changed files. A failed step
# goes to the seat owning most of those files. Uses the SUPABASE_ACCESS_TOKEN repository secret (present since 7 Sep 2026).
#
# 14 SEP 2026, FIRST REAL RUN (34883190441, merge 1081ed0) FAILED AFTER 15 MINUTES, AND NOT FOR THE REASON
# IT PRINTED. Every poll printed "none", but underneath each one was
#   gh: Resource not accessible by integration (HTTP 403)
# The repository's default GITHUB_TOKEN carries contents/metadata/packages read only, and the deployments
# API needs `deployments: read`. `2>/dev/null || true` turned the 403 into "not deployed yet". Vercel had
# deployed that commit to "Production" at 18:46 UTC, three minutes before the job started, and the
# `environment=Production` filter matches it (measured with a PAT: 1 deployment, status success). So the
# case of the environment name was not the cause. The fixes: grant `deployments: read`, let an API error
# fail the step at once, match "production" case-insensitively anyway (a second Vercel project would
# report "Production – <project>"), and say on timeout whether no deployment was reported or which
# state it got stuck in.
#
# The same run's log shows "::notice::SUPABASE_ACCESS_TOKEN is not set", but that line is the echo of
# the script's own source. The step env shows `SUPABASE_ACCESS_TOKEN: ***`, and checkout ran, so skip was
# never set. The gate still changed: a smoke test that cannot report now FAILS the job. It used to skip
# quietly and leave a green run over nothing.

on:
  workflow_run:
    workflows: ['deploy edge functions']
    types: [completed]
    branches: [main]
  # Re-run the smoke for a merge that already deployed, without another push to main.
  workflow_dispatch:
    inputs:
      sha:
        description: 'full commit sha on main whose Vercel production deployment to smoke-test'
        required: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: read
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      QD_E2E_REPORTS: e2e-out
      SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: the smoke test can report
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is empty in this job: the smoke test cannot report to fn_it_smoke_ingest, so it does not run"
            exit 1
          fi
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::'$SHA' is not a full commit sha"; exit 1; }
      # Runs BEFORE checkout, so a dispatch for an older sha still uses this version of the poll.
      # Vercel reports its production deployment of the commit to GitHub. The newest one decides.
      - name: wait for vercel production of this commit
        run: |
          set -euo pipefail
          last="no production deployment reported for $SHA"
          for i in $(seq 1 30); do
            # An API error (403, 404) is not "not deployed yet": gh exits non-zero and set -e fails the step.
            dep=$(gh api "repos/$REPO/deployments?sha=$SHA&per_page=100" \
                  --jq '[.[] | select(.environment | ascii_downcase | startswith("production"))][0].id // empty')
            if [ -n "$dep" ]; then
              states=$(gh api "repos/$REPO/deployments/$dep/statuses?per_page=100" --jq '[.[].state] | join(" ")')
              latest=${states%% *}
              last="deployment $dep, statuses newest first: ${states:-none}"
              echo "vercel production for $SHA: $last"
              case "$latest" in
                success) exit 0 ;;
                failure|error) echo "::error::Vercel production deploy of $SHA ended '$latest' ($last)"; exit 1 ;;
                inactive)
                  # Vercel marks a production deployment inactive once a later one replaces it.
                  if [[ " $states " == *" success "* ]]; then
                    echo "::notice::$SHA deployed to production and was later superseded; the smoke runs against the site as it is now"
                    exit 0
                  fi
                  echo "::error::Vercel production deploy of $SHA went inactive without a success ($last)"; exit 1 ;;
              esac
            else
              echo "vercel production for $SHA: none yet"
            fi
            sleep 30
          done
          echo "::error::Vercel production deploy of $SHA did not succeed in 15 minutes: $last"; exit 1
      # After a merge the harness is the merged commit's. A dispatch runs the harness from the branch it
      # was dispatched on against the deployed site, so a harness fix can be proved before it merges.
      # The changed files are always the deployed commit's own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm ci && npx playwright install --with-deps chromium
      - run: git diff --name-only "$SHA~1" "$SHA" > changed-files.txt
      # A failed journey step is the finding, not a failed job. The report below always runs, and it
      # fails the job if it cannot hand the run over (no run.json, or the database call throws).
      - run: node scripts/e2e/run.mjs --journey a,b,c
        continue-on-error: true
      - run: node scripts/e2e/report_to_it_engineer.mjs e2e-out --smoke "$SHA" changed-files.txt
