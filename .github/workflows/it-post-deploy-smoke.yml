name: IT engineer post-deploy smoke

# Duty 16 (founder, 14 Sep 2026: "yea add them"). After every merge to main whose edge-function deploy
# succeeded, wait for Vercel's production deployment of the same commit, run a short harness journey
# on demo data (sign in, portal overview, one request, one quote, the comparison PDF in en and ar),
# purge it, and hand the result to fn_it_smoke_ingest with the merge's changed files. A failed step
# goes to the seat owning most of those files. Needs the SUPABASE_ACCESS_TOKEN repository secret.

on:
  workflow_run:
    workflows: ['deploy edge functions']
    types: [completed]
    branches: [main]

jobs:
  smoke:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      QD_E2E_REPORTS: e2e-out
      SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set; the smoke test cannot report"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != '1'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 2
      # Vercel reports its production deployment of the commit to GitHub; wait for success (15 min).
      - if: steps.gate.outputs.skip != '1'
        run: |
          for i in $(seq 1 30); do
            state=$(gh api "repos/${{ github.repository }}/deployments?sha=$SHA&environment=Production" --jq '.[0].statuses_url' \
                    | xargs -r -I{} gh api {} --jq '.[0].state' 2>/dev/null || true)
            echo "vercel production for $SHA: ${state:-none}"
            [ "$state" = "success" ] && exit 0
            [ "$state" = "failure" ] || [ "$state" = "error" ] && { echo "::error::Vercel production deploy $state"; exit 1; }
            sleep 30
          done
          echo "::error::Vercel production deploy did not finish in 15 minutes"; exit 1
      - if: steps.gate.outputs.skip != '1'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - if: steps.gate.outputs.skip != '1'
        run: npm ci && npx playwright install --with-deps chromium
      - if: steps.gate.outputs.skip != '1'
        run: git diff --name-only HEAD~1 HEAD > changed-files.txt
      - if: steps.gate.outputs.skip != '1'
        run: node scripts/e2e/run.mjs --journey a,b,c
        continue-on-error: true
      - if: steps.gate.outputs.skip != '1'
        run: node scripts/e2e/report_to_it_engineer.mjs e2e-out --smoke "$SHA" changed-files.txt
