# Deploy edge functions, under the same rules a human deploy follows.
#
# ── WHY THIS IS NOT THE FIVE-LINE VERSION ───────────────────────────────────────────────────────
# The common recipe for this is:
#
#     - run: supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
#
# It works, and against this repository it would have caused an outage on its first run. Four
# reasons, each of which cost something to learn:
#
#   1. IT DEPLOYS ON PUSH TO main. Production currently runs an unmerged branch. A workflow keyed
#      to main would have deployed OLDER code over the newer code that is live.
#   2. IT DEPLOYS ALL 196 FUNCTIONS EVERY TIME, bumping 196 version numbers and destroying the one
#      signal that says which function actually moved.
#   3. IT HAS NO verify_jwt DRIFT CHECK. On 3 Aug 2026 a deploy flipped verify_jwt and a function
#      silently began rejecting every request. supabase/config.toml is the single source of truth;
#      deploying while it disagrees with live means nobody knows which value is about to win.
#   4. IT TRUSTS THE CLI's EXIT CODE. A deploy that reports success and does not bump the version
#      did not happen. Observed in this repo today, while testing the script this workflow calls.
#
# All four rules live in scripts/deploy_functions.mjs, so CI and a human run the same code rather
# than two implementations that drift.
#
# ── WHAT THIS DOES AND DOES NOT DO ──────────────────────────────────────────────────────────────
# Push to a branch       -> deploy the CHANGED functions to STAGING, after deno check.
# Push to main           -> STAGING, then PRODUCTION with the same resolved slug set.
# Manual dispatch        -> the one project ref someone typed, and nothing else.
#
# ── "PRODUCTION IS NEVER AUTOMATIC" USED TO BE WRITTEN HERE, AND IT COST US (14 Aug 2026) ────────
# It was deliberate, and it was wrong for a reason nobody had measured: production then moved only
# when somebody remembered to dispatch this workflow by hand, and the dispatch input DEFAULTS to the
# staging ref — so the easy path was the wrong one and the correct path was an act of memory.
#
# Measured across all 199 functions on both projects: 168 deployed bundles differed. Most was
# harmless dependency drift (every function imports jsr:@supabase/supabase-js@2, floating on major,
# so a July build resolved 2.108.2 against staging's 2.112.3). But cos_execute and dept_plan shared
# the SAME dependency version and still differed by exactly 5,839 bytes each — an identical delta
# across two functions means a shared module, and production was carrying an older compiled
# _shared/internal_auth.ts than the repo. Merged in #316, live on staging and only staging since
# 13 Aug. First-party code, merged, CI-green, and not in production for a day.
#
# Reason 1 in the list above — "production currently runs an unmerged branch" — was the original
# justification and it has expired: main is what production runs now, which is why the promotion is
# keyed to a push to main and not to any branch.
#
# The safety that mattered is kept, and is stricter than a flag: production is a SEPARATE step that
# runs only after the staging deploy succeeds, so a bundle that cannot reach staging can never reach
# production. deploy_functions.mjs still enforces all four rules below for both targets.
#
# ── REQUIRED SECRET ─────────────────────────────────────────────────────────────────────────────
#   SUPABASE_ACCESS_TOKEN   a personal access token from https://supabase.com/dashboard/account/tokens
# The project refs are NOT secrets — they appear in every function URL — so they are written here
# where they can be read and reviewed rather than hidden in a settings page.
name: deploy edge functions

on:
  push:
    branches: ['**']
    # scripts/deploy_functions.mjs added 8 Sep 2026. This workflow's only real work is running that
    # script, and it did not rerun when the script changed -- so a fix to the deployer was never
    # exercised by the deployer. Found the hard way: the change that repaired a red deploy job
    # triggered nothing, because it touched no path on this list.
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
      - 'scripts/deploy_functions.mjs'
      - 'scripts/ci/resolve_diff_base.sh'
  workflow_dispatch:
    inputs:
      target:
        description: 'Project ref to deploy to. There is only one project now; this exists so a dispatch still has to name it deliberately.'
        required: true
        default: htdblwldjkcgjvmqkbeh
      slugs:
        description: 'Space-separated function names. Leave blank to deploy what changed in the last commit.'
        required: false
        default: ''

# ── ONE PRODUCTION DEPLOY AT A TIME, AND NEVER AN OLDER TREE OVER A NEWER ONE (13 Oct 2026) ─────
# Two main runs overlapped: #1382 (8189d06) started 02:47, #1393 (eed2765) started 02:50, and the
# older run finished last. At 02:52 it deployed supplier_portal v288 from the OLDER tree over
# #1393's fix. Main deploys (push or dispatch) now share one group and queue; cancel-in-progress is
# false so no run is killed halfway through a deploy. Branch runs only typecheck, so each branch
# keeps its own group. The "Is this still main's head?" step below closes the other half.
#
# LIMIT: GitHub holds ONE pending run per group. When a third main run arrives while one runs and one
# waits, the waiting one is cancelled by GitHub. Its conclusion is "cancelled", shown in the run list,
# never a green success. A cancelled PUSH loses nothing: the next push widens its diff base to the
# last push that deployed. A cancelled DISPATCH is NOT covered by anything and must be dispatched
# again; the run list shows it as cancelled, not as passed.
concurrency:
  group: ${{ github.ref == 'refs/heads/main' && 'deploy-functions-production' || format('deploy-functions-{0}', github.ref) }}
  cancel-in-progress: false

# actions: read lets a main push find the last run that really deployed (see "Work out what changed").
permissions:
  contents: read
  actions: read

env:
  # STAGING_REF is gone with the staging branch it named (deleted 15 Aug 2026). One project, one ref.
  PRODUCTION_REF: htdblwldjkcgjvmqkbeh
  DENO_NO_PACKAGE_JSON: "1"   # see checks.yml: deno never resolves the app's package.json (12 Oct 2026)

jobs:
  deploy:
    name: deploy changed functions
    runs-on: ${{ vars.RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # deploy_functions.mjs --changed diffs against a base commit, so the runner needs more
          # than the shallow single commit actions/checkout fetches by default.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci

      # PINNED (21 Sep 2026). `version: latest` asks the GitHub API which release is newest, without a
      # token, so a busy hour fails the deploy before it starts: PR #785 run 35627998129, "Failed to
      # resolve latest Supabase CLI release: rate limit exceeded". A pinned version downloads directly.
      # Raise it deliberately; scripts/checks/the_function_deploy_pins_its_supabase_cli.test.mjs refuses `latest`.
      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The base to diff against: scripts/ci/resolve_diff_base.sh (ancestor-checked event.before,
      # else merge-base with origin/main on a branch, else HEAD~1).
      - name: Work out what changed
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ github.event.inputs.target }}" >> "$GITHUB_OUTPUT"
            echo "slugs=${{ github.event.inputs.slugs }}" >> "$GITHUB_OUTPUT"
            echo "base=${{ github.sha }}~1" >> "$GITHUB_OUTPUT"
            # A dispatch already names its own target, so it never promotes on top of it.
            echo "promote=false" >> "$GITHUB_OUTPUT"
          else
            # A rebase or force-push leaves github.event.before outside history, and the diff then
            # died with "Invalid symmetric difference expression" (#1158, #1173, #1179 ...). The
            # resolver uses it only when it is a real ancestor; otherwise a branch diffs from its
            # merge-base with main (a superset of the push, so nothing is skipped) and main from
            # HEAD~1. It logs which base it chose.
            is_main=false
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then is_main=true; fi
            before=$(bash scripts/ci/resolve_diff_base.sh '${{ github.event.before }}' main "$is_main")
            # ── A SKIPPED OLDER RUN MUST NOT LOSE ITS FUNCTIONS (13 Oct 2026) ───────────────────
            # An older main run that finds a newer main head deploys nothing (see the guard below),
            # so this run must cover that commit's changes too. On main the base widens to the head
            # of the last PUSH run whose Deploy step actually ran, when that is an ancestor of HEAD.
            # A dispatch is excluded: it deploys only the slugs someone named.
            if [ "$is_main" = "true" ]; then
              # Every gh call fails the run on an API error or rate limit (set -e, no || fallbacks):
              # a silently narrowed base would skip functions. --paginate walks every page.
              set -euo pipefail
              last=""
              ids=$(gh api --paginate "repos/${{ github.repository }}/actions/workflows/deploy-functions.yml/runs?branch=main&event=push&status=success&per_page=100" --jq '.workflow_runs[] | "\(.id) \(.head_sha)"')
              while read -r id sha; do
                [ -z "$id" ] && continue
                ran=$(gh api --paginate "repos/${{ github.repository }}/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[].steps[] | select(.name=="Deploy" and .conclusion=="success")] | length')
                if [ "$(echo "$ran" | awk '{s+=$1} END {print s+0}')" != "0" ]; then last="$sha"; break; fi
              done <<< "$ids"
              if [ -z "$last" ]; then
                echo "::error::no earlier main push run ever deployed; refusing to guess a diff base"; exit 1
              fi
              if git merge-base --is-ancestor "$last" "$before"; then
                echo "diff base widened to $last, the last main push that deployed (was $before)"
                before="$last"
              else
                echo "::error::last deployed push $last is not an ancestor of $before (main rewritten?); refusing to deploy from a narrowed base. Dispatch the affected slugs from main's head."
                exit 1
              fi
            fi
            # ── THERE IS NO STAGING ANY MORE (15 Aug 2026) ───────────────────────────────────────
            # The founder deleted the staging branch: "from now on there is no staging branches. we
            # directly build, test, pass then production." `list_projects` now returns exactly one
            # project. This line used to name STAGING_REF, which no longer resolves to anything —
            # every push would have deployed into a project that does not exist.
            #
            # The safety that mattered is kept and is now stricter, not looser. Deploying is gated
            # on the branch instead of on a second environment: a push to main deploys to
            # production, and a push to any other branch resolves the same slug set, prints it, and
            # TYPECHECKS it, but the deploy step below does not run. Build, test, pass, then
            # production — with the typecheck as the gate that used to be staging.
            echo "ref=${{ env.PRODUCTION_REF }}" >> "$GITHUB_OUTPUT"
            echo "slugs=" >> "$GITHUB_OUTPUT"
            echo "base=$before" >> "$GITHUB_OUTPUT"
            # ── PRODUCTION WAS ONLY EVER AS CURRENT AS THE LAST MANUAL DEPLOY (14 Aug 2026) ───────
            # This workflow deployed a push to STAGING_REF and stopped there, so production only
            # moved when somebody remembered to dispatch it with the production ref typed by hand —
            # and the dispatch input defaults to staging, so the easy path was the wrong one.
            #
            # MEASURED: 168 of 199 production bundles differed from staging. Most was dependency
            # drift (functions import jsr:@supabase/supabase-js@2, floating on major, so production
            # ran 2.108.2 against staging's 2.112.3), but cos_execute and dept_plan shared the same
            # dependency version and still differed by exactly 5,839 bytes each — production was
            # carrying an OLDER compiled _shared/internal_auth.ts than the repo. That change was
            # merged in #316 and had been live on staging, and only staging, since 13 Aug.
            #
            # A merge to main is the point at which the repo becomes the truth, so that is where the
            # promotion belongs. Other branches still deploy to staging alone.
            if [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "promote=true" >> "$GITHUB_OUTPUT"
            else
              echo "promote=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Print the set before doing anything to it. "Deployed nothing" and "had nothing to deploy"
      # look identical in a log otherwise, and only one of them is fine.
      - name: What would deploy
        run: |
          node scripts/deploy_functions.mjs --ref=${{ steps.scope.outputs.ref }} \
            ${{ steps.scope.outputs.slugs || format('--changed --base={0}', steps.scope.outputs.base) }} \
            --production --dry-run

      # A compile error in an edge function is a silent 500, not a visible failure — which is why
      # the repo has a deno-check gate at all. Deploying without it would route around the gate.
      - name: Typecheck what is about to deploy
        run: |
          slugs=$(node scripts/deploy_functions.mjs --ref=${{ steps.scope.outputs.ref }} \
            ${{ steps.scope.outputs.slugs || format('--changed --base={0}', steps.scope.outputs.base) }} \
            --production --dry-run | sed -n 's/^[0-9]* function(s): //p')
          if [ -z "$slugs" ]; then echo "nothing to typecheck"; exit 0; fi
          files=""
          for s in $slugs; do files="$files supabase/functions/$s/index.ts"; done
          echo "deno check$files"
          deno check --no-lock --node-modules-dir=auto $files

      # ── IS THE TOKEN THERE? ──────────────────────────────────────────────────────────────────
      # Measured 8 Aug 2026: this repository has NO secrets set at all. Shipping a deploy step that
      # simply uses the token would have made this workflow red on its first run, and the repo's own
      # CI header already records why that is the wrong move — "a permanently red gate teaches
      # people to ignore gates".
      #
      # Skipping is not the same as passing, and this must not read as a green deploy that deployed
      # nothing. So the absence is announced as a warning annotation and the deploy step is skipped
      # by an explicit condition, which shows in the run as a step that did not execute.
      #
      # The secrets context cannot be read in a job-level `if`, so it is mapped to an output here.
      - name: Check the token is configured
        id: gate
        env:
          TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning title=Deploy skipped::SUPABASE_ACCESS_TOKEN is not set, so no functions were deployed. Add it under Settings > Secrets and variables > Actions, from https://supabase.com/dashboard/account/tokens"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Gated on the BRANCH now that there is no staging to absorb a bad bundle first. A dispatch
      # names its own functions but deploys ONLY when run on main (29 Sep 2026): a dispatch on any
      # other branch would put unreviewed code on production, so it dry-runs like a branch push.
      # A push deploys only from main. Everything else has already been printed and typechecked
      # above, which is the "test, pass" half.
      # ── IS THIS STILL MAIN'S HEAD? (13 Oct 2026) ────────────────────────────────────────────
      # Checked at the last moment before deploying. If origin/main is not this run's commit (moved
      # on, or force-pushed elsewhere), this run's tree is not main and must not deploy:
      #   - a PUSH deploys nothing and stays green; the run for main's head deploys, and its base
      #     widens to cover this commit.
      #   - a DISPATCH FAILS. It names slugs nobody else will deploy, so passing green would lose
      #     them silently. Re-dispatch it; it then runs at main's head.
      - name: Is this still main's head?
        id: fresh
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch --quiet origin main
          head=$(git rev-parse origin/main)
          if [ "$head" != "${{ github.sha }}" ] && [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::error title=Dispatch not deployed::origin/main moved to $head while this dispatch of ${{ github.sha }} waited. Nothing deployed. Dispatch again to deploy the named slugs from main's head."
            exit 1
          elif [ "$head" != "${{ github.sha }}" ]; then
            echo "::notice title=Deploy skipped, superseded::origin/main is now $head, not ${{ github.sha }}. Deploying nothing; the run for main's head deploys."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "origin/main is ${head}; this run (${{ github.sha }}) deploys."
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: >-
          steps.gate.outputs.configured == 'true'
          && github.ref == 'refs/heads/main'
          && steps.fresh.outputs.current == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # --production is passed only when the target IS production; the script refuses otherwise,
          # so a typo in the dispatch input cannot reach production by accident.
          prod=""
          if [ "${{ steps.scope.outputs.ref }}" = "${{ env.PRODUCTION_REF }}" ]; then prod="--production"; fi
          node scripts/deploy_functions.mjs --ref=${{ steps.scope.outputs.ref }} $prod \
            ${{ steps.scope.outputs.slugs || format('--changed --base={0}', steps.scope.outputs.base) }}

      # ── AND THEN PRODUCTION ──────────────────────────────────────────────────────────────────
      # Deliberately a SEPARATE step, after the staging deploy, rather than a loop over both refs:
      # if staging fails, this step does not run, so a broken bundle cannot reach production by
      # being second in a list. The same resolved slug set is used for both, so the two projects
      # move together or not at all.
      #
      # deploy_functions.mjs takes --changed --base itself, and its own logic widens the set to
      # every importer when anything under _shared moves — that widening is what production has been
      # missing, not the tooling. Passing the identical arguments is the point.
      # The separate "Deploy to production" step is gone. It existed to promote a bundle from
      # staging to production AFTER staging accepted it, so a broken bundle could not reach
      # production by being second in a list. With one project the Deploy step above IS the
      # production deploy, and running a second identical deploy would only make the log lie about
      # how many places the code went.

      # An announcement, so a run that deployed and a run that did not are distinguishable in the
      # log without reading the step conditions.
      - name: Say whether production was updated
        run: |
          deployable='${{ github.ref == 'refs/heads/main' }}'
          if [ "$deployable" = "true" ] && [ "${{ steps.fresh.outputs.current }}" = "false" ]; then
            echo "superseded — origin/main moved past ${{ github.sha }}; the newer run deploys. Production NOT updated by this run."
          elif [ "$deployable" = "true" ] && [ "${{ steps.gate.outputs.configured }}" = "true" ]; then
            echo "deployed to production (${{ env.PRODUCTION_REF }})"
          elif [ "$deployable" = "true" ]; then
            echo "::warning title=Not deployed::this run was deployable but SUPABASE_ACCESS_TOKEN is not set, so production was NOT updated."
          else
            echo "typechecked only — not main (event ${{ github.event_name }}, ref ${{ github.ref }}). There is no staging to deploy to; production moves from main."
          fi
