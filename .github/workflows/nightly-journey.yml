name: Nightly full journey (demo data)

# The IT engineer's duty 1 (founder, 14 Sep 2026: "fine add them"). Drives scripts/e2e/run.mjs — demo
# identities on reserved addresses, Stripe TEST only, every row torn down by its tag — and hands the
# result to public.fn_it_journey_ingest, which opens a finding for the seat that owns each failed step.
#
# It uses the repository secret SUPABASE_ACCESS_TOKEN (present since 7 Sep 2026, also used by the deploy
# workflow). If it were ever missing the job skips with a notice, and the IT engineer reports the missing
# run itself after 26 hours (fn_it_duties, 'journey_heartbeat').

# founder 26 Oct (ledger 1279) switched every automatic trigger off; founder 28 Oct (ledger 1410): "activate github actions",
# on GitHub-hosted runners. push / pull_request / workflow_run are back; schedules stay on pg_cron (moved 26 Oct, no double run).
# founder 10 Nov (ledger 1564): GitHub Actions off, its budget is spent; a Claude session runs checks, applies and deploys
on:
  # schedule:
    # - cron: '0 22 * * *'   # 02:00 Dubai
  workflow_dispatch:
    inputs:
      journeys:
        description: 'run.mjs --journey list (e.g. a,b,c,d); empty = every journey. A subset never settles findings of journeys it skipped (run_scope.mjs).'
        required: false
        default: ''

jobs:
  journey:
    runs-on: ubuntu-latest
    # 17 Sep 2026: the wall was 30 minutes and NOTHING told the harness about it. Two consecutive
    # nights (35037401883, 35164572430) were cancelled mid-crawl, which skips the report step below,
    # so the heartbeat never reached fn_it_journey_ingest (duty:journey_heartbeat:no_run, open 3 days
    # while the test ran every night) and the runs' demo identities were never torn down
    # (duty:demo:leads, duty:demo:customers). run.mjs now stops at QD_E2E_DEADLINE_MS and always
    # reaches teardown and the report; the job wall is set above it so the deadline is what ends a
    # long run, not the cancellation.
    #
    # WHY THE WALL IS ABOVE THE DEADLINE: the deadline is a START cutoff — it stops the harness
    # beginning a new journey or a new crawl viewport, and cannot interrupt one already running.
    # Journey c alone chains six 180-second calls, so a journey that starts on the deadline can
    # legitimately run for ~20 more minutes. A wall the harness can hit is the bug this file fixed;
    # the wall exists only to stop a genuinely hung runner.
    #
    # WHY 35 AND NOT 20 (18 Sep 2026, measured). 20 minutes does not fit the work, and the run that
    # does not fit is the crawl — the only journey that looks at every screen. Run 35301487989 (last
    # night, 02:59): journeys a-e finished at 03:19, the deadline fell at 03:21, and of the EIGHT
    # crawl surfaces (2 portals x en/ar x desktop/mobile) it reached ONE and part of a second; six
    # were recorded "not crawled" and journey g never started. The job itself used 42 of its 60
    # minutes, so nothing was short of wall clock — the harness was stopping itself less than
    # two-thirds of the way through. A run that never looks at six of eight surfaces cannot settle a
    # finding on those surfaces (run.mjs COMPLETE=false), so the nightly has been proving the funnel
    # and almost none of the screens. A full pass measured against production the same morning took
    # ~33 minutes end to end; 35 leaves the crawl room to finish, and the wall moves with it
    # (35 + ~24 worst in-flight + ~5 npm ci and playwright install + teardown and the report).
    # 21 Sep 2026: +6 minutes for journey h (the audit's presses), measured at ~6 min on its first
    # production run, and it runs before the crawl, so the crawl keeps the room it had.
    # 24 Sep 2026: +36 minutes for the three drawing journeys (3 x 12 minute ceiling), run before the report.
    # 18 Oct 2026 (#1427): every long step now has its OWN ceiling, so the job wall always leaves the always() window
    # close and the verdict their time. Sum of step ceilings: install 5 + journeys 70 (deadline 41 + ~24 worst in-flight
    # journey + 3 teardown + 2) + drawings 38 (3 x 12 + 2 for closing a killed child) + report 3 + quote review 10
    # (measured 6.3 min on 18 Oct) = 126, + checkout/setup ~1 = 127; window close 3 + verdict ~0 = 130; wall 133.
    # A step that hits its ceiling is cancelled, its outcome is 'failure', and the verdict below reports it red.
    # 3 Nov 2026 (sales_engineer): quote review 10 -> 16 and the wall 133 -> 139. Branch run 41623020490 hit the 10-minute
    # ceiling: two devices, each waiting on model-written engineer turns (up to 90 s each, re-asked when unanswered), and
    # the journey now also presses Submit after Generate.
    timeout-minutes: 139
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      QD_E2E_REPORTS: e2e-out
      QD_E2E_DEADLINE_MS: '2460000'
      # rehearsal window run time = timeout-minutes 117 + 3 teardown; fn_rehearsal_window_sweep closes it after that
      QD_E2E_WINDOW_MIN: '120'
      # every run tag a script opens (fixtures.openRun), so the always() step below closes what a killed script left open
      QD_E2E_RUN_TAGS: e2e-run-tags.txt
    steps:
      - id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set; the IT engineer reports the missing run itself"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != '1'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: steps.gate.outputs.skip != '1'
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - if: steps.gate.outputs.skip != '1'
        run: npm ci && npx playwright install --with-deps chromium
        timeout-minutes: 5
      # A failed step is the finding, not a failed job: the report below always runs.
      - id: journeys
        if: steps.gate.outputs.skip != '1'
        env:
          JOURNEYS: ${{ inputs.journeys }}
        run: node scripts/e2e/run.mjs ${JOURNEYS:+--journey "$JOURNEYS"}
        continue-on-error: true
        timeout-minutes: 70
      # THE DRAWING JOURNEYS, WALKED EVERY NIGHT AND REPORTED (24 Sep 2026, sales_engineer; drawings audit finding 3,
      # review of #967). drawing_reaches_suppliers (a PDF set: redacted, taken off, matched, printed EN/AR),
      # cad_identity_reaches_no_supplier (a CAD title block's parties never reach a supplier; only demo suppliers
      # matched) and every_drawing_format_is_read (DXF ascii + binary, DWG small and queued; Revit, IFC and DGN refused) run here,
      # BEFORE the report, and their PASS / FAIL lines are written into this run's steps.json as journey
      # "f-drawings/..." - so fn_it_journey_ingest hands a failure to the sales engineer instead of it dying in a log.
      # Up to 12 minutes each (drawing_journeys_into_report.mjs PER_SCRIPT_MS); the wall above grew by 36.
      # A dispatched subset (inputs.journeys) re-proves a funnel fix; the drawings and the quote review are not part of it.
      - id: drawings
        if: steps.gate.outputs.skip != '1' && inputs.journeys == ''
        run: node scripts/e2e/drawing_journeys_into_report.mjs e2e-out
        continue-on-error: true
        timeout-minutes: 38
      - if: steps.gate.outputs.skip != '1'
        run: node scripts/e2e/report_to_it_engineer.mjs e2e-out
        timeout-minutes: 3
      # THE QUOTATION REVIEW, WALKED, BECAUSE NOTHING WAS WALKING IT (18 Sep 2026).
      # The founder on this flow, 15 Sep: "this is the most important part in the whole supplier
      # portal, so make sure its built perfectly". scripts/e2e/supplier_quote_review.mjs walks it end
      # to end in both languages on desktop and a phone — and no workflow, no CI job and no npm
      # script ran it. It is how tonight's handover defect was found by hand and how it would
      # otherwise have stayed unfound: journey b drives the quotation through supplier_api, never
      # through the review conversation the supplier actually uses.
      # It runs AFTER the ingest above so a failure here cannot delay the journey heartbeat, and with
      # continue-on-error for the same reason every other step has it: a failed step is the finding.
      - id: quote_review
        if: steps.gate.outputs.skip != '1' && inputs.journeys == ''
        run: node scripts/e2e/supplier_quote_review.mjs
        continue-on-error: true
        timeout-minutes: 16
        env:
          QD_SHOTS: e2e-out/quote-review
      # THE SCREENSHOTS LEAVE THE RUNNER (3 Nov 2026, sales_engineer). Runs 41598217377 and 41623020490 failed in the
      # quotation review with no artifact at all, so nobody could see what the screen showed. ZZ DEMO screens only; kept 7 days.
      - if: always() && steps.gate.outputs.skip != '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-journey-screens
          # screenshots only: the reports carry signed storage links, which stay on the runner
          path: |
            e2e-out/**/*.png
            e2e-out/**/*.jpg
          retention-days: 7
          if-no-files-found: ignore
      # A WINDOW THIS JOB OPENED NEVER OUTLIVES IT (18 Oct 2026). 13-18 Oct a drawing journey killed at its ceiling left
      # its qd_run window open past expires_at every night, and every harness run (stage2 included) refused to start.
      # Runs even when a step failed or the job was cancelled; touches only the tags this job wrote to QD_E2E_RUN_TAGS.
      - if: always() && steps.gate.outputs.skip != '1'
        run: node scripts/e2e/close_job_windows.mjs "$QD_E2E_RUN_TAGS"
        timeout-minutes: 3
      # THE BADGE TELLS THE TRUTH (18 Oct 2026). continue-on-error keeps the report and the window close running after a
      # failed journey - and also turned run 39079803518 green over three steps that exited 1. The failures are handed
      # to their seats above; this step makes the run itself red when any journey step failed.
      - if: always() && steps.gate.outputs.skip != '1'
        env:
          JOURNEYS: ${{ steps.journeys.outcome }}
          DRAWINGS: ${{ steps.drawings.outcome }}
          QUOTE_REVIEW: ${{ steps.quote_review.outcome }}
        run: |
          echo "journeys=$JOURNEYS drawings=$DRAWINGS quote_review=$QUOTE_REVIEW"
          # 'skipped' only when a dispatched subset left the drawings and the quote review out (their if: above).
          for o in "$JOURNEYS" "$DRAWINGS" "$QUOTE_REVIEW"; do
            if [ "$o" != success ] && [ "$o" != skipped ]; then echo "::error::a nightly journey step failed (journeys=$JOURNEYS drawings=$DRAWINGS quote_review=$QUOTE_REVIEW)"; exit 1; fi
          done
