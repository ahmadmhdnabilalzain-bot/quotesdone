name: External resilience watchdog

# A THIRD-PARTY CROSS-CHECK, ONCE A DAY. The 15-minute cadence moved to Vercel Cron
# (vercel.json -> /api/resilience-ping) because a ten-second curl every 15 minutes is billed by
# GitHub as a full minute each time: 2,880 minutes a month against a 2,000-minute allowance, which
# consumed 90% of it in nine days and left the build gate competing with a curl.
#
# This run stays so that something OUTSIDE BOTH Supabase and Vercel still checks daily — a
# simultaneous failure of both would otherwise go unseen.
# This is the one resilience check that cannot live inside the database: an in-cluster
# watchdog is itself a pg_cron job, so it cannot detect a TOTAL pg_cron outage. GitHub's
# scheduler is independent of both Supabase and Vercel, so it survives that failure mode.
# The edge function does all the work (detect + page the founder over HTTP); this job only
# has to hit the URL. Since 6 Oct 2026 the sweep runs only for an authenticated caller, so the job reads
# the service key through the management API with SUPABASE_ACCESS_TOKEN (the one repository secret)
# and masks it before use. Without it the function answers liveness only and this job fails.

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ${{ vars.RUNNER || 'ubicloud-standard-2' }}
    timeout-minutes: 5
    steps:
      - name: Ping resilience watchdog
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          key="$(curl -sS --max-time 30 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            'https://api.supabase.com/v1/projects/htdblwldjkcgjvmqkbeh/api-keys?reveal=true' \
            | jq -r '[.[] | select(.name == "service_role")][0].api_key // empty')"
          [ -n "$key" ] || { echo "::error::could not read the service key through the management API"; exit 1; }
          echo "::add-mask::$key"
          # -m MUST EXCEED THE FUNCTION'S OWN DEADLINE. Measured 17 Sep 2026: this job failed 4/4 on
          # 14, 15, 16 and 17 Sep, every one `curl: (28) ... 30002 ms`, last green 13 Sep — while
          # resilience_ping itself ran 194 times in 48 h with 0 failures. The function declares
          # DEADLINE_MS = 110_000 and runs its ticks in sequence, several with their own 55 s
          # sub-timeouts, so a 30 s caller could never see the answer once one tick ran long. The one
          # watchdog that exists BECAUSE an in-cluster check cannot detect a total outage was red over
          # a healthy system for four days — indistinguishable from the outage it watches for.
          # scripts/checks/resilience_ping_reports_every_tick.test.mjs now fails if this number, or
          # the Vercel route's, is below the function's deadline.
          resp="$(curl -sS -m 180 -X POST \
            https://htdblwldjkcgjvmqkbeh.supabase.co/functions/v1/resilience_ping \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $key" -d '{}')"
          echo "resilience_ping -> $resp"
          echo "$resp" | grep -q '"ok":true' || { echo "::error::resilience_ping unreachable or errored"; exit 1; }
          echo "$resp" | grep -q '"sweep":"not_run"' && { echo "::error::resilience_ping refused the key and ran no sweep"; exit 1; } || true
