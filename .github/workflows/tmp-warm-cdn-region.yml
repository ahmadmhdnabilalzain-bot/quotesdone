name: TEMPORARY warm_cdn region probe (PR 674, remove before merge)

on:
  push:
    branches: [it-engineer/warm-the-portal-after-deploy]
    paths: [.github/workflows/tmp-warm-cdn-region.yml]

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node scripts/e2e/warm_cdn.mjs
