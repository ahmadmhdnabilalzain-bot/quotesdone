name: Conversation continuity and grounding (browser proof, ZZ DEMO)

# customer_support with sales_engineer, founder ledger 1464 (2 Nov 2026): the homepage widget, the sales engineer in the portals
# and customer support must never hallucinate, never lose the conversation and never start again from the beginning.
# Drives scripts/e2e/conversation_continuity.mjs in a real browser (Playwright) against the LIVE site: a 16-turn conversation per
# surface with a reload, another page and back, a second tab, a language switch, close and reopen, a lost reply and its retry,
# the visitor cap and the rate limit, and a lost / restored / corrupt conversation key; every answer graded against company
# knowledge. Every turn is recorded as the artifact "continuity-out".
#
# The identities are made by the repository's fixtures (ZZ DEMO, @example.invalid, torn down by the run's tag); the real model
# answers inside a rehearsal window capped at USD 4 (ruling 1260); no real person can be reached. It runs on a push to the
# files it is made of, and by hand. Uses the repository secret SUPABASE_ACCESS_TOKEN, as nightly-journey.yml does.
# founder 10 Nov (ledger 1564): GitHub Actions off, its budget is spent; a Claude session runs checks, applies and deploys
on:
  workflow_dispatch:
    inputs:
      site:
        description: Site to drive (default https://quotesdone.ae)
        required: false
        default: https://quotesdone.ae
      surface:
        description: widget,portal,supplier (default all)
        required: false
        default: widget,portal,supplier
      forward:
        description: "1 when the site is a Vercel preview (its widget calls /functions/v1 on its own origin; the run forwards them to the project, tagged)"
        required: false
        default: '0'

permissions:
  contents: read

concurrency:
  group: conversation-continuity
  cancel-in-progress: false

jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      QD_SITE: ${{ inputs.site || 'https://quotesdone.ae' }}
      QD_FORWARD_FUNCTIONS: ${{ inputs.forward || '0' }}
      QD_OUT: continuity-out
      QD_CAP_USD: '4'
      # rehearsal window = job wall; fn_rehearsal_window_sweep closes it after that if the run dies
      QD_E2E_WINDOW_MIN: '80'
      QD_E2E_RUN_TAGS: e2e-run-tags.txt
    steps:
      - id: gate
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN is not set; the continuity run needs it for the demo fixtures and is skipped"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != '1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.gate.outputs.skip != '1'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - if: steps.gate.outputs.skip != '1'
        run: npm ci && npx playwright install --with-deps chromium
        timeout-minutes: 8
      - if: steps.gate.outputs.skip != '1'
        run: node --test scripts/checks/the_continuity_graders_catch_bad_answers.test.mjs scripts/checks/the_widget_finds_a_stored_answer_and_redraws_its_history.test.mjs
      - if: steps.gate.outputs.skip != '1'
        id: drive
        env:
          SURFACES: ${{ inputs.surface || 'widget,portal,supplier' }}
        run: node scripts/e2e/conversation_continuity.mjs --surface "$SURFACES"
        timeout-minutes: 60
      # the run's tag is closed even if the script was killed: its rows are torn down by the same tag
      - if: always() && steps.gate.outputs.skip != '1'
        run: node scripts/e2e/close_job_windows.mjs "$QD_E2E_RUN_TAGS"
        timeout-minutes: 3
      - if: always() && steps.gate.outputs.skip != '1'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: continuity-out
          path: continuity-out
          if-no-files-found: warn
