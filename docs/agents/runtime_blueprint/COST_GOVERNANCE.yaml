version: v2026.08.14
openrouter_guardrails_required: true
documentation: https://openrouter.ai/docs/guides/features/guardrails/overview
keys:
  runtime_production:
    daily_usd: 50
    weekly_usd: 300
    monthly_usd: 1200
    models:
    - anthropic/claude-haiku-4.5
    - anthropic/claude-sonnet-5
    - openai/gpt-5.2:exacto
    - google/gemini-3.6-flash
    - anthropic/claude-opus-5
    opus_requires_critical_trigger: true
  staging_smoke:
    daily_usd: 5
    monthly_usd: 50
    models:
    - anthropic/claude-haiku-4.5
    - anthropic/claude-sonnet-5
    - openai/gpt-5.2:exacto
    - google/gemini-3.6-flash
    opus_allowed: false
  targeted_regression:
    daily_usd: 20
    monthly_usd: 100
    models:
    - anthropic/claude-haiku-4.5
    - anthropic/claude-sonnet-5
    - openai/gpt-5.2:exacto
    - google/gemini-3.6-flash
    opus_allowed: false
  full_certification:
    enabled: false
    budget_required: true
    no_fallback_to_unrestricted_key: true
per_task_caps_usd:
  routine_structured: 0.035
  routine_tool: 0.05
  professional_analysis: 0.15
  manager_decision: 0.25
  multimodal_extraction: 0.12
  visual_quality_review: 0.12
  independent_review: 0.22
  critical_escalation: 0.6
controls:
- Pre-run projected cost and founder-approved ceiling for any run above USD 20.
- Automatic stop before estimated remaining questions exceed remaining budget.
- Actual OpenRouter usage.cost, prompt, completion, reasoning and cached tokens persisted
  on every response.
- No automatic top-up and no fallback to a different unrestricted API key.
- Prompt caching enabled for stable role/company prefixes; cache effectiveness recorded.
- Response caching only for deterministic identical non-sensitive test requests where
  policy permits.
