version: v2026.08.14
governing_rules:
- Deterministic SQL/rules perform routing, validation, arithmetic, completeness, permissions
  and hard gates whenever possible.
- The role-level model is a default; task_class, risk, modality, live evidence and
  independent-review requirements may override it.
- No task may silently upgrade to a higher-cost model after exceeding its cost cap.
- 'Critical decisions require model diversity: creator and final reviewer cannot use
  the same effective role and should normally use different model families.'
- Tool-calling requests use OpenRouter Auto Exacto by default; explicit :exacto is
  required for independent review and consequential tool workflows.
- Static role/department prefixes use prompt caching. Dynamic tool results and current
  facts are appended after the cacheable prefix.
- A full knowledge pack is never loaded wholesale; retrieval is scoped and traced.
task_classes:
  deterministic:
    model: none
    max_cost_usd: 0
    examples:
    - route lookup
    - field completeness
    - permission check
    - pricing arithmetic
    - idempotency check
  routine_structured:
    model: anthropic/claude-haiku-4.5
    reasoning: low
    max_input_tokens: 12000
    max_output_tokens: 1200
    max_cost_usd: 0.035
  routine_tool:
    model: anthropic/claude-haiku-4.5:exacto
    reasoning: low
    max_input_tokens: 14000
    max_output_tokens: 1400
    max_cost_usd: 0.05
  professional_analysis:
    model: anthropic/claude-sonnet-5
    reasoning: medium
    max_input_tokens: 24000
    max_output_tokens: 2200
    max_cost_usd: 0.15
  manager_decision:
    model: anthropic/claude-sonnet-5
    reasoning: high
    max_input_tokens: 32000
    max_output_tokens: 2800
    max_cost_usd: 0.25
    review_model: openai/gpt-5.2:exacto
  multimodal_extraction:
    model: google/gemini-3.6-flash
    reasoning: medium
    max_input_tokens: 24000
    max_output_tokens: 1800
    max_cost_usd: 0.12
    fallback: anthropic/claude-sonnet-5
  visual_quality_review:
    model: anthropic/claude-sonnet-5
    reasoning: medium
    max_input_tokens: 18000
    max_output_tokens: 1600
    max_cost_usd: 0.12
    requires_actual_asset: true
  independent_review:
    model: openai/gpt-5.2:exacto
    reasoning: high
    max_input_tokens: 28000
    max_output_tokens: 2400
    max_cost_usd: 0.22
    escalation: anthropic/claude-opus-5
  critical_escalation:
    model: anthropic/claude-opus-5
    reasoning: high
    max_input_tokens: 48000
    max_output_tokens: 3600
    max_cost_usd: 0.6
    requires_policy_trigger: true
fallback_order:
- anthropic/claude-haiku-4.5
- anthropic/claude-sonnet-5
- openai/gpt-5.2:exacto
- anthropic/claude-opus-5
prohibited:
- Model calls for calculations or checks already represented by deterministic rules.
- Automatic Opus use without a critical escalation trigger.
- Tool result claims when no successful tool_result_id exists.
- Execution of a truncated or schema-invalid consequential output.
- Using certification questions or answer keys as runtime retrieval knowledge.
