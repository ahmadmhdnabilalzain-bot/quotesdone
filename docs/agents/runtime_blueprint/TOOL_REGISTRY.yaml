version: v2026.08.14
standard_result_envelope:
  required_fields:
  - tool_call_id
  - tool_id
  - status
  - data_hash
  - source_timestamp
  - freshness
  - latency_ms
  - cost_usd
  - retryable
  - trace_id
  status_values:
  - success
  - empty
  - error
  - timeout
  - unauthorized
  - stale
  - blocked
  rule: Only status=success with a non-null data_hash may be treated as evidence.
    Empty/error/timeout/unauthorized/stale are explicit evidence gaps, never successful
    data.
