<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>QuotesDone · Admin</title>
<style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#0b3b34;color:#16181d;font:15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
.bar{background:#0b3b34;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px}.bar b{font-size:17px}.bar span{color:#5eead4}
.wrap{max-width:1000px;margin:18px auto;padding:0 14px 80px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(0,0,0,.05)}
input{border:1px solid #d1d5db;border-radius:10px;padding:9px 10px;font:inherit;width:100%}
button{background:#0d9488;color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}button.g{background:#eef2f7;color:#16181d}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tab{padding:8px 12px;border-radius:999px;background:#10504644;color:#d1fae5;font-weight:600;cursor:pointer;font-size:13px;border:1px solid #2a6b60}.tab.on{background:#5eead4;color:#06302a;border-color:#5eead4}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:14px}.kpi .n{font-size:24px;font-weight:800;color:#0d9488}.kpi .l{font-size:12px;color:#6b7280;margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #eef0f2;vertical-align:top}th{color:#6b7280;font-weight:600;font-size:12px}
.badge{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:#fef9c3;color:#854d0e}.badge.ok{background:#dcfce7;color:#166534}.badge.due{background:#fee2e2;color:#991b1b}
.muted{color:#6b7280}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}h3{margin:4px 0 0}
</style></head><body>
<div class="bar"><b>Quotes<span>Done</span></b> · Admin <span id="who" style="margin-left:auto;font-size:13px"></span></div>
<div class="wrap"><div id="root">Loading…</div></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const URL_='https://htdblwldjkcgjvmqkbeh.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0ZGJsd2xkamtjZ2p2bXFrYmVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3ODU1NDYsImV4cCI6MjA5NjM2MTU0Nn0.cF9ZR_Qo1YBhLvhTLS8aANlYb6c9rTsuQS6kLxGw_Bo';
const supa=createClient(URL_,ANON);const root=document.getElementById('root');
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const money=n=>'AED '+Number(n||0).toLocaleString();
async function api(action,payload={}){const{data:{session}}=await supa.auth.getSession();const r=await fetch(URL_+'/functions/v1/admin_api',{method:'POST',headers:{'Authorization':'Bearer '+(session?session.access_token:''),'Content-Type':'application/json'},body:JSON.stringify({action,...payload})});return r.json();}
supa.auth.onAuthStateChange(()=>boot());boot();
async function boot(){const{data:{session}}=await supa.auth.getSession();if(!session)return loginView();document.getElementById('who').textContent=session.user.email;dash('overview');}
function loginView(){document.getElementById('who').textContent='';root.innerHTML='<div class="card" style="max-width:380px"><h3>Admin sign in</h3><p class="muted" style="font-size:13px">Only authorised admin emails can view this dashboard.</p><div style="margin:8px 0"><input id="em" type="email" placeholder="management@quotesdone.com"></div><div id="o" style="display:none;margin:8px 0"><input id="co" inputmode="numeric" placeholder="6-digit code"></div><div style="display:flex;gap:8px;align-items:center"><button id="s">Email me a code</button><button id="v" class="g" style="display:none">Verify</button><span id="m" class="muted" style="font-size:13px"></span></div></div>';
 document.getElementById('s').onclick=async()=>{const email=document.getElementById('em').value.trim();if(!email)return;document.getElementById('m').textContent='Sending…';const{error}=await supa.auth.signInWithOtp({email,options:{shouldCreateUser:true}});document.getElementById('m').textContent=error?error.message:'Code sent.';if(!error){document.getElementById('o').style.display='block';document.getElementById('v').style.display='inline-block';}};
 document.getElementById('v').onclick=async()=>{const email=document.getElementById('em').value.trim();const token=document.getElementById('co').value.trim();const{error}=await supa.auth.verifyOtp({email,token,type:'email'});if(error)document.getElementById('m').textContent=error.message;};}
const TABS=[['overview','Overview'],['inquiries','Inquiries'],['revenue','Revenue'],['suppliers','Suppliers'],['review_queue','Review queue'],['kyc','KYC']];
async function dash(tab){root.innerHTML='<div class="tabs">'+TABS.map(([k,l])=>'<div class="tab '+(k===tab?'on':'')+'" data-k="'+k+'">'+l+'</div>').join('')+'<div style="margin-left:auto"><button class="g" id="out" style="padding:6px 12px;font-size:13px">Sign out</button></div></div><div id="body">Loading…</div>';
 root.querySelectorAll('.tab').forEach(t=>t.onclick=()=>dash(t.dataset.k));document.getElementById('out').onclick=()=>supa.auth.signOut();
 const b=document.getElementById('body');
 try{
  if(tab==='overview'){const{overview:o,error}=await api('overview');if(error)return b.innerHTML='<div class="card">'+esc(error)+'</div>';
   b.innerHTML='<div class="kpis">'+[['Customers',(o.total_customers||0).toLocaleString()],['Suppliers registered',(o.suppliers_registered||0).toLocaleString()],['Total inquiries',o.inquiries||0],['Total quotations',o.quotes||0],['Deals won',o.deals||0],['Success ratio',(o.success_ratio||0)+'%'],['Revenue',money(o.revenue_total)],['Pending approvals',o.pending_approvals||0]].map(([l,n])=>'<div class="kpi"><div class="n">'+n+'</div><div class="l">'+l+'</div></div>').join('')+'</div>'+
    '<div class="card"><b>Needs your attention</b><table><tr><th>Item</th><th>Count</th></tr><tr><td>Inbound emails to review</td><td><b>'+o.review_queue+'</b></td></tr><tr><td>Suppliers awaiting KYC verification</td><td><b>'+o.kyc_pending+'</b></td></tr><tr><td>Self-registered suppliers</td><td>'+o.selfreg+'</td></tr></table></div>';}
  else if(tab==='inquiries'){const{inquiries:x}=await api('inquiries');b.innerHTML='<div class="card"><table><tr><th>When</th><th>Category</th><th>Emirate</th><th>Summary</th><th>Matched</th><th>Quotes</th><th>Status</th></tr>'+(x||[]).map(i=>'<tr><td class="muted">'+new Date(i.created_at).toLocaleDateString()+'</td><td>'+esc(i.category)+'</td><td>'+esc(i.emirate||'')+'</td><td>'+esc((i.summary||'').slice(0,70))+'</td><td>'+i.matches+'</td><td>'+i.quotes+'</td><td><span class="badge '+(i.status==='accepted'?'ok':'')+'">'+esc(i.status)+'</span></td></tr>').join('')+'</table>'+((x&&x.length)?'':'<div class="muted">No inquiries yet.</div>')+'</div>';}
  else if(tab==='revenue'){const{transactions:x}=await api('revenue');b.innerHTML='<div class="card"><table><tr><th>When</th><th>Supplier</th><th>Quote</th><th>Customer paid</th><th>Your fee</th><th>Status</th></tr>'+(x||[]).map(t=>'<tr><td class="muted">'+new Date(t.revealed_at).toLocaleDateString()+'</td><td>'+esc(t.supplier)+'</td><td>'+money(t.quote_amount)+'</td><td>'+money(t.customer_price)+'</td><td><b>'+money(t.app_fee)+'</b></td><td><span class="badge '+(t.fee_status==='due'?'due':'ok')+'">'+esc(t.fee_status)+'</span></td></tr>').join('')+'</table>'+((x&&x.length)?'':'<div class="muted">No deals yet.</div>')+'</div>';}
  else if(tab==='suppliers'){const{suppliers:x}=await api('suppliers');b.innerHTML='<div class="card"><table><tr><th>Company</th><th>Trade</th><th>Emirate</th><th>Source</th><th>Status</th></tr>'+(x||[]).map(s=>'<tr><td>'+esc(s.company_name)+'</td><td>'+esc(s.sector||'')+'</td><td>'+esc(s.emirate||'')+'</td><td class="muted">'+esc(s.source||'')+'</td><td>'+(s.verified?'<span class="badge ok">verified</span>':(s.claimed?'<span class="badge">claimed</span>':''))+'</td></tr>').join('')+'</table></div>';}
  else if(tab==='review_queue'){const{queue:x}=await api('review_queue');b.innerHTML='<div class="card"><p class="muted" style="font-size:13px">Inbound supplier emails that matched several companies — nothing was written automatically.</p><table><tr><th>When</th><th>From</th><th>Subject</th><th>Note</th></tr>'+(x||[]).map(m=>'<tr><td class="muted">'+new Date(m.created_at).toLocaleDateString()+'</td><td class="mono">'+esc(m.from_email)+'</td><td>'+esc((m.subject||'').slice(0,50))+'</td><td class="muted">'+esc(m.ai_notes||'')+'</td></tr>').join('')+'</table>'+((x&&x.length)?'':'<div class="muted">Nothing to review.</div>')+'</div>';}
  else if(tab==='kyc'){const{kyc:x}=await api('kyc');b.innerHTML='<div class="card"><p class="muted" style="font-size:13px">New suppliers pending verification — read the AI check, then approve or reject.</p>'+((x||[]).map(s=>'<div style="border:1px solid #eef0f2;border-radius:10px;padding:10px;margin:8px 0"><b>'+esc(s.company_name)+'</b> <span class="muted">· '+esc(s.emirate||'')+'</span><table style="margin-top:6px"><tr><td class="muted">Signatory</td><td>'+esc(s.signatory_name||s.contact_name||'')+'</td><td class="muted">Phone</td><td>'+esc(s.phone||'')+'</td></tr><tr><td class="muted">Licence</td><td>'+esc(s.trade_license_no||'')+' '+esc(s.license_authority||'')+'</td><td class="muted">TRN</td><td>'+esc(s.trn||'')+'</td></tr><tr><td class="muted">Bank</td><td>'+esc(s.bank_name||'')+'</td><td class="muted">IBAN</td><td class="mono">'+esc(s.bank_iban||'')+'</td></tr></table>'+(s.ai_review_notes?'<div class="muted" style="font-size:12px;margin-top:6px"><b>AI review:</b> '+esc(s.ai_review_notes)+'</div>':'')+(s.services?'<div class="muted" style="font-size:12px"><b>Services:</b> '+esc(s.services)+'</div>':'')+'<div style="margin-top:8px"><button data-v="'+s.id+'">Approve supplier</button> <button class="g" data-rej="'+s.id+'" style="margin-left:6px">Reject</button></div></div>').join(''))+((x&&x.length)?'':'<div class="muted">No pending verifications.</div>')+'</div>';
   b.querySelectorAll('button[data-v]').forEach(btn=>btn.onclick=async()=>{btn.disabled=true;btn.textContent='Verifying…';const r=await api('verify_supplier',{id:Number(btn.dataset.v)});if(r.ok){btn.textContent='✓ Verified';}else{btn.disabled=false;btn.textContent='Retry';alert(r.error||'error');}});b.querySelectorAll('button[data-rej]').forEach(btn=>btn.onclick=async()=>{if(!confirm('Reject this supplier registration?'))return;btn.disabled=true;const r=await api('reject_supplier',{id:Number(btn.dataset.rej)});if(r.ok){btn.textContent='Rejected';}else{btn.disabled=false;alert(r.error||'error');}});}
 }catch(e){b.innerHTML='<div class="card">'+esc(String(e))+'</div>';}
}
</script></body></html>
