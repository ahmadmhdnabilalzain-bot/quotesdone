<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Supplier Registration — QuotesDone</title><link rel="icon" href="data:image/svg+xml,%3Csvg%20width%3D%2230%22%20height%3D%2230%22%20viewBox%3D%220%200%20512%20512%22%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22116%22%20fill%3D%22%230d9488%22/%3E%3Cpath%20d%3D%22M96%20150%20a54%2054%200%200%201%2054%20-54%20h212%20a54%2054%200%200%201%2054%2054%20v152%20a54%2054%200%200%201%20-54%2054%20h-148%20l-66%2062%20l8%20-62%20h-6%20a54%2054%200%200%201%20-54%20-54%20z%22%20fill%3D%22%23fff%22/%3E%3Cg%20fill%3D%22%230d9488%22%3E%3Cpath%20d%3D%22M150%20196%20c0%20-20%2011%20-33%2031%20-39%20l5%2012%20c-11%205%20-16%2011%20-18%2020%20h18%20v35%20h-36%20z%22/%3E%3Cpath%20d%3D%22M204%20196%20c0%20-20%2011%20-33%2031%20-39%20l5%2012%20c-11%205%20-16%2011%20-18%2020%20h18%20v35%20h-36%20z%22/%3E%3C/g%3E%3Cpath%20d%3D%22M205%20300%20l52%2050%20l104%20-118%22%20fill%3D%22none%22%20stroke%3D%22%230d9488%22%20stroke-width%3D%2244%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E">
<style>:root{--bg:#04101a;--ink:#eaf6f4;--mut:#8fa6ab;--teal:#2dd4bf;--cyan:#22d3ee;--vio:#7c83ff;--card:rgba(255,255,255,.04);--line:rgba(255,255,255,.10);--glass:rgba(8,28,34,.55);--grad:linear-gradient(100deg,#5eead4,#22d3ee 45%,#7c83ff)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,-apple-system,Segoe UI,Roboto,sans-serif;overflow-x:hidden}
h1,h2,h3,.step,.price,.kpi .n{font-family:'Space Grotesk',Inter,sans-serif;letter-spacing:-.01em}
a{color:var(--teal);text-decoration:none}
.bgfx{position:fixed;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(60% 50% at 50% -5%,rgba(45,212,191,.12),transparent 60%),radial-gradient(40% 40% at 100% 0%,rgba(124,131,255,.10),transparent 60%),var(--bg)}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:floatx 18s ease-in-out infinite}
.orb.a{width:480px;height:480px;background:radial-gradient(circle,#0f766e,transparent 70%);top:-140px;left:-120px}
.orb.b{width:420px;height:420px;background:radial-gradient(circle,#0e7490,transparent 70%);top:40%;right:-140px;animation-delay:-6s}
.orb.c{width:360px;height:360px;background:radial-gradient(circle,#4338ca,transparent 70%);bottom:-140px;left:25%;opacity:.35;animation-delay:-11s}
@keyframes floatx{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(26px,-26px) scale(1.07)}}
.gridfx{position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(circle at 50% 20%,#000,transparent 75%);mask-image:radial-gradient(circle at 50% 20%,#000,transparent 75%)}
.wrap{max-width:740px;margin:0 auto;padding:26px 18px 90px;position:relative}
h1{font-size:22px;margin:0 0 2px;font-weight:700}
h1 span{color:var(--teal)}
.sub{color:var(--mut);font-size:13.5px;margin-bottom:18px;max-width:560px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;backdrop-filter:blur(12px);box-shadow:0 20px 40px rgba(0,0,0,.35)}
.step{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);margin-bottom:10px}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:10px 11px;font:inherit;background:rgba(255,255,255,.05);color:var(--ink);width:100%}
input::placeholder,textarea::placeholder{color:#6f868c}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);background:rgba(45,212,191,.06)}
select option{background:#0a1f2b;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
button{background:var(--grad);color:#04222b;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer;transition:.2s}
button:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(45,212,191,.4)}
button.gray,button.ghost{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line)}
button.ghost:hover,button.gray:hover{border-color:var(--teal);color:var(--teal);box-shadow:none}
button:disabled{opacity:.5;transform:none;box-shadow:none}
.iconbtn{display:inline-flex;align-items:center;gap:6px;background:rgba(45,212,191,.12);color:#7ff0e2;border:1px solid rgba(45,212,191,.35);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.iconbtn.rec{background:rgba(239,68,68,.16);color:#fca5a5;border-color:rgba(239,68,68,.4)}
.muted{color:var(--mut);font-size:13px}
.q{margin:12px 0}.q label{display:block;font-weight:600;margin-bottom:5px;font-size:14px;color:var(--ink)}
.q.miss label{color:#fcd34d}.q.miss input,.q.miss select{border-color:#f59e0b;background:rgba(245,158,11,.08)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;margin:14px 0 0}.tab{flex:1;text-align:center;padding:10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);font-weight:600;cursor:pointer;color:var(--mut)}.tab.on{background:var(--grad);color:#04222b;border-color:transparent}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}.kpi .n{font-size:22px;font-weight:700;color:var(--teal)}.kpi .l{font-size:11px;color:var(--mut)}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:rgba(254,243,199,.15);color:#fcd34d}.badge.ok{background:rgba(34,197,94,.2);color:#86efac}
.em{display:inline-flex;align-items:center;gap:5px;font-size:13px;margin:2px 12px 2px 0}
.req{color:#f87171}.hide{display:none}
table.fees{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}.fees td,.fees th{border:1px solid var(--line);padding:6px 9px;text-align:left}.fees th{background:rgba(255,255,255,.05);color:var(--mut)}
.agree{background:rgba(45,212,191,.08);border:1px solid rgba(45,212,191,.3);border-radius:10px;padding:12px;margin-top:10px}
.res{border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:5px 0;cursor:pointer}.res:hover{border-color:var(--teal);background:rgba(45,212,191,.07)}
.inq{border:1px solid var(--line);border-radius:12px;padding:13px;margin:10px 0;background:rgba(255,255,255,.03)}
.qt{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;background:rgba(255,255,255,.03);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.price{font-size:18px;font-weight:700;color:var(--teal)}
.pill{display:inline-block;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;margin:2px 4px 2px 0;color:#cfe6e3}
.contact{background:rgba(45,212,191,.08);border:1px solid rgba(45,212,191,.3);border-radius:10px;padding:12px;margin-top:8px}.contact a{color:var(--teal);font-weight:600}
.ai{background:rgba(34,211,238,.08);border:1px solid rgba(34,211,238,.3);border-radius:10px;padding:10px;margin-top:10px;font-size:13px;color:#a5e8f0}
.star{color:#fbbf24}.thumb{display:inline-block;width:48px;height:48px;border-radius:8px;border:1px solid var(--line);object-fit:cover;margin:4px 4px 0 0;vertical-align:middle}
.err{color:#f87171;font-size:13px}.ok{color:#86efac;font-size:13px}
.logo svg{vertical-align:-6px;margin-right:7px}</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"></head><body><div class="bgfx"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div><div class="gridfx"></div><div class="wrap">
<h1><svg width="30" height="30" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" style="vertical-align:-7px;margin-right:7px"><rect width="512" height="512" rx="116" fill="#0d9488"/><path d="M96 150 a54 54 0 0 1 54 -54 h212 a54 54 0 0 1 54 54 v152 a54 54 0 0 1 -54 54 h-148 l-66 62 l8 -62 h-6 a54 54 0 0 1 -54 -54 z" fill="#fff"/><g fill="#0d9488"><path d="M150 196 c0 -20 11 -33 31 -39 l5 12 c-11 5 -16 11 -18 20 h18 v35 h-36 z"/><path d="M204 196 c0 -20 11 -33 31 -39 l5 12 c-11 5 -16 11 -18 20 h18 v35 h-36 z"/></g><path d="M205 300 l52 50 l104 -118" fill="none" stroke="#0d9488" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/></svg>Quotes<span style="color:#0d9488">Done</span> — Supplier Registration</h1><div class="sub">Join the QuotesDone network — receive matched customer inquiries and quote. Verification + bank details required.</div>
<div id="app">Loading…</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>window.pdfToImages=async function(b64){const L=window.pdfjsLib;L.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const raw=atob(b64);const arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);const pdf=await L.getDocument({data:arr}).promise;const out=[];const n=Math.min(pdf.numPages,5);for(let p=1;p<=n;p++){const pg=await pdf.getPage(p);const vp=pg.getViewport({scale:1.6});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;out.push({mime:'image/jpeg',data:c.toDataURL('image/jpeg',0.75).split(',')[1]});}return out;};</script>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const URL_='https://htdblwldjkcgjvmqkbeh.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0ZGJsd2xkamtjZ2p2bXFrYmVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA3ODU1NDYsImV4cCI6MjA5NjM2MTU0Nn0.cF9ZR_Qo1YBhLvhTLS8aANlYb6c9rTsuQS6kLxGw_Bo';
const supa=createClient(URL_,ANON);
const EMIRATES=['Dubai','Abu Dhabi','Sharjah','Ajman','Ras Al Khaimah','Umm Al Quwain','Fujairah'];
const app=document.getElementById('app');let ME=null;
async function api(action,payload={}){const {data:{session}}=await supa.auth.getSession();const r=await fetch(URL_+'/functions/v1/supplier_api',{method:'POST',headers:{'Authorization':'Bearer '+(session?.access_token||ANON),'Content-Type':'application/json'},body:JSON.stringify({action,...payload})});return r.json();}
async function aiQuote(payload){const {data:{session}}=await supa.auth.getSession();const r=await fetch(URL_+'/functions/v1/quote_ai',{method:'POST',headers:{'Authorization':'Bearer '+(session?.access_token||ANON),'Content-Type':'application/json'},body:JSON.stringify(payload)});return r.json();}
function esc(s){return String(s==null?'':s).replace(/"/g,'&quot;')}
supa.auth.onAuthStateChange((_e,session)=>{setTimeout(()=>render(session),0);});
supa.auth.getSession().then(({data})=>render(data.session));
async function render(session){if(!session){return loginView();}await appView();}
function loginView(){app.innerHTML=`<div class="card"><div class="step">Sign in</div>
  <div class="q"><label>Your work email</label><input id="email" type="email" placeholder="you@company.ae"></div>
  <div class="row"><button id="send">Email me a code</button><span id="msg" class="muted"></span></div>
  <div id="otp" class="hide"><div class="q"><label>Enter the 6-digit code</label><input id="code" inputmode="numeric" placeholder="123456"></div><div class="row"><button id="verify">Verify &amp; continue</button></div></div></div>`;
  document.getElementById('send').onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email)return;document.getElementById('msg').textContent='Sending…';const {error}=await supa.auth.signInWithOtp({email,options:{shouldCreateUser:true}});document.getElementById('msg').innerHTML=error?('<span class="err">'+error.message+'</span>'):'Code sent — check your email.';if(!error)document.getElementById('otp').classList.remove('hide');};
  document.getElementById('verify').onclick=async()=>{const email=document.getElementById('email').value.trim();const token=document.getElementById('code').value.trim();const {error}=await supa.auth.verifyOtp({email,token,type:'email'});if(error)document.getElementById('msg').innerHTML='<span class="err">'+error.message+'</span>';};
}
async function appView(){const me=await api('me');ME=me.supplier;
  if(!ME){return claimView();}
  const d=await api('dashboard');
  app.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><div><b>${ME.company_name}</b> ${d.approval_status==='approved'?'<span class="badge ok">verified</span>':(d.approval_status==='rejected'?'<span class="badge">needs info</span>':(d.approval_status==='pending'?'<span class="badge">pending verification</span>':'<span class="badge">complete your profile</span>'))}${d.rating&&d.rating.value?' <span class="muted" style="font-size:13px">★ '+d.rating.value+' ('+d.rating.count+' '+d.rating.source+')</span>':''}</div><button class="gray" id="out">Sign out</button></div>
    <div class="kpis" style="margin-top:12px"><div class="kpi"><div class="n">${d.active||0}</div><div class="l">Active inquiries</div></div><div class="kpi"><div class="n">${d.quoted||0}</div><div class="l">Projects quoted</div></div><div class="kpi"><div class="n">${d.won||0}</div><div class="l">Projects won</div></div></div></div>
    ${d.approval_status==='pending'?`<div class="card" style="border-color:#f59e0b;background:#fffbeb"><b>\u23f3 Your registration is under review.</b> We verify new suppliers within 3 working days and email you once approved. You can finish your profile now \u2014 submitting quotes unlocks after approval.</div>`:''}${d.approval_status==='rejected'?`<div class="card" style="border-color:#ef4444;background:#fef2f2"><b>We need a bit more info.</b> Please review your details below and re-save, or reply to our email.</div>`:''}
    <div class="card"><div class="step">Company profile, verification &amp; agreement</div><div id="pf"></div></div>
    <div class="card"><div class="step">Inbox — matched inquiries</div><div id="inbox">Loading…</div></div>
    <div class="card"><div class="step">Your projects (won)</div><div id="projects" class="muted">Loading…</div></div>`;
  document.getElementById('out').onclick=()=>supa.auth.signOut();
  profileForm();loadInbox();loadProjects();
}
function claimView(){const CATS=['flooring','glass','aluminium','steel','acrylic','carpentry','gypsum','signage','wallpaper','upholstery','fitout','painting','landscaping','scaffolding','security','safety'];
 app.innerHTML=`<div class="card"><div class="step">Find &amp; claim your company</div>
   <div class="muted">Search the directory — most UAE suppliers are already listed.</div>
   <div class="row"><input id="s" placeholder="Company name"><button id="sb">Search</button></div><div id="sr"></div></div>
   <div class="card"><div class="step">Not listed? Add your company</div>
     <div class="q"><label>Company name <span class="req">*</span></label><input id="c_name" placeholder="As on your trade licence"></div>
     <div class="grid"><div class="q"><label>Main category <span class="req">*</span></label><select id="c_cat">${CATS.map(c=>`<option value="${c}">${c.charAt(0).toUpperCase()+c.slice(1)}</option>`).join('')}</select></div>
       <div class="q"><label>Emirate <span class="req">*</span></label><select id="c_em">${EMIRATES.map(e=>`<option>${e}</option>`).join('')}</select></div></div>
     <div class="row"><button id="addco">Add my company &amp; continue</button><span id="addmsg" class="muted"></span></div></div>`;
  document.getElementById('sb').onclick=async()=>{const q=document.getElementById('s').value.trim();const {results}=await api('search',{q});const el=document.getElementById('sr');
     el.innerHTML=(results&&results.length)?results.map(r=>`<div class="res" data-id="${r.id}" data-ok="${r.claimable}"><b>${r.company_name}</b> <span class="muted">&middot; ${r.emirate||''}</span> ${r.claimed?(r.claimable?'<span class="badge ok">yours</span>':'<span class="badge">claimed</span>'):''}</div>`).join(''):'<div class="muted">No match found &mdash; use Add your company below.</div>';
     el.querySelectorAll('.res').forEach(d=>d.onclick=async()=>{if(d.dataset.ok!=='true'){alert('Already claimed by another account.');return}const res=await api('claim',{leads_id:Number(d.dataset.id)});if(res.error){alert(res.error)}else{appView()}});};
  document.getElementById('addco').onclick=async()=>{const name=document.getElementById('c_name').value.trim();if(!name){alert('Enter your company name');return;}document.getElementById('addmsg').textContent='Adding...';const res=await api('create_company',{company_name:name,category:document.getElementById('c_cat').value,emirate:document.getElementById('c_em').value});if(res.error){document.getElementById('addmsg').innerHTML='<span class="err">'+res.error+'</span>'}else{appView()}};
}
function profileForm(){const r=ME,sel=new Set(r.service_emirates||(r.emirate?[r.emirate]:[]));
  document.getElementById('pf').innerHTML=`<div class="grid">
    <div class="q"><label>Authorized signatory <span class="req">*</span></label><input id="f_sig" value="${esc(r.signatory_name)}"></div>
    <div class="q"><label>Phone <span class="req">*</span></label><input id="f_phone" value="${esc(r.phone)}"></div></div>
   <div class="q"><label>Products / services you quote <span class="req">*</span></label><textarea id="f_products">${(r.products||'')}</textarea></div>
   <div class="q"><label>Emirates you serve <span class="req">*</span></label><div id="f_em">${EMIRATES.map(e=>`<label class="em"><input type="checkbox" value="${e}" ${sel.has(e)?'checked':''}> ${e}</label>`).join('')}</div></div>
   <div class="grid"><div class="q"><label>Trade licence no. <span class="req">*</span></label><input id="f_lic" value="${esc(r.trade_license_no)}"></div>
    <div class="q"><label>Issuing authority</label><input id="f_auth" value="${esc(r.license_authority)}" placeholder="DED / free zone"></div>
    <div class="q"><label>Licence expiry</label><input id="f_exp" type="date"></div>
    <div class="q"><label>VAT no. (TRN)</label><input id="f_trn" value="${esc(r.trn)}"></div></div>
   <div class="q"><label>Upload trade licence (PDF/JPG/PNG, max 5MB) ${r.license_doc_path?'<span class="badge ok">uploaded</span>':''}</label><input id="f_licdoc" type="file" accept=".pdf,.jpg,.jpeg,.png"></div>
   <div class="grid"><div class="q"><label>Economic Register (EGR) no.</label><input id="f_egr" value="${esc(r.egr_number)}"></div></div>
   <div class="q"><label>Upload EGR / establishment certificate (max 5MB) ${r.egr_doc_path?'<span class="badge ok">uploaded</span>':''}</label><input id="f_egrdoc" type="file" accept=".pdf,.jpg,.jpeg,.png"></div>
   <div class="step" style="margin-top:10px">Bank / payout</div>
   <div class="grid"><div class="q"><label>Bank name <span class="req">*</span></label><input id="f_bank" value="${esc(r.bank_name)}"></div>
    <div class="q"><label>Account name <span class="req">*</span></label><input id="f_acc" value="${esc(r.bank_account_name)}"></div></div>
   <div class="q"><label>IBAN <span class="req">*</span></label><input id="f_iban" value="${esc(r.bank_iban)}" placeholder="AE.."></div>
   <div class="q"><label>Upload IBAN / bank letter (max 5MB) ${r.iban_doc_path?'<span class="badge ok">uploaded</span>':''}</label><input id="f_ibandoc" type="file" accept=".pdf,.jpg,.jpeg,.png"></div>
   <div class="step" style="margin-top:10px">Registration &amp; fees</div>
   <div class="muted">QuotesDone takes <b>no commission</b> from your jobs — you always receive your full quoted amount. The customer pays a small reveal fee to us separately. Registration is <b>free for the first 1,000 suppliers</b>, then <b>AED 100 / year</b>.</div>
   
   ${r.registration_status==='due'?`<div class="agree" style="border-color:#f59e0b"><b>Your AED 100 yearly registration is due.</b> <button id="payreg" style="margin-left:8px;padding:6px 12px;font-size:13px">Pay AED 100</button> <span id="regmsg" class="muted"></span></div>`:`<div class="muted" style="font-size:13px;margin-top:6px">Registration: <span class="badge ok">${r.registration_status||'active'}</span>${r.registration_expires_at?' \u00b7 renews '+new Date(r.registration_expires_at).toLocaleDateString():''}</div>`}
   <div class="agree"><label style="font-weight:600"><input type="checkbox" id="f_agree" ${r.accepted_terms_at?'checked':''}> I accept the <a href="/supplier-agreement/" target="_blank">Supplier Agreement &amp; platform terms</a> (v2).</label>${r.accepted_terms_at?'<div class="muted">Accepted on '+new Date(r.accepted_terms_at).toLocaleString()+'</div>':''}</div>
   <div class="row"><button id="save">Save &amp; activate</button><span id="sv" class="muted"></span></div>`;
  document.getElementById('save').onclick=saveProfile;const pr=document.getElementById('payreg');if(pr)pr.onclick=async()=>{pr.disabled=true;document.getElementById('regmsg').textContent='Processing…';const res=await api('pay_registration');document.getElementById('regmsg').textContent=res.ok?'✓ Paid — registration active':(res.error||'error');if(res.ok){const me=await api('me');ME=me.supplier;profileForm();}};
}
async function uploadDoc(inputId,kind){const f=document.getElementById(inputId).files[0];if(!f)return null;if(f.size>5242880){alert('File too large (max 5MB): '+f.name);throw new Error('too big');}const ext=(f.name.split('.').pop()||'dat').toLowerCase();const path=ME.id+'/'+kind+'_'+Date.now()+'.'+ext;const {error}=await supa.storage.from('supplier-docs').upload(path,f,{upsert:true,contentType:f.type});if(error){alert('Upload failed: '+error.message);throw error;}return path;}
async function saveProfile(){const req=['f_sig','f_phone','f_products','f_lic','f_bank','f_acc','f_iban'];for(const id of req){if(!document.getElementById(id).value.trim()){alert('Please complete all required (*) fields.');document.getElementById(id).focus();return;}}
  if(!document.getElementById('f_agree').checked){alert('You must accept the commission terms to activate.');return;}
  const ems=[...document.querySelectorAll('#f_em input:checked')].map(e=>e.value);if(!ems.length){alert('Select at least one emirate.');return;}
  document.getElementById('sv').textContent='Saving…';
  let licPath,ibanPath;try{licPath=await uploadDoc('f_licdoc','license');ibanPath=await uploadDoc('f_ibandoc','iban');var egrPath=await uploadDoc('f_egrdoc','egr');}catch(e){document.getElementById('sv').textContent='';return;}
  const v=id=>document.getElementById(id).value;
  const payload={signatory_name:v('f_sig'),phone:v('f_phone'),products:v('f_products'),service_emirates:ems,trade_license_no:v('f_lic'),license_authority:v('f_auth'),trn:v('f_trn'),license_expiry:v('f_exp')||null,bank_name:v('f_bank'),bank_account_name:v('f_acc'),bank_iban:v('f_iban'),accept_terms:true,terms_version:'v2',egr_number:document.getElementById('f_egr')?document.getElementById('f_egr').value:null};
  if(licPath)payload.license_doc_path=licPath;if(ibanPath)payload.iban_doc_path=ibanPath;if(egrPath)payload.egr_doc_path=egrPath;
  const res=await api('save_profile',payload);if(res.ok){let msg='<span class="ok">✓ Submitted — pending verification (within 3 working days)</span>';if(res.review&&res.review.issues&&res.review.issues.length){msg+='<div class="muted" style="font-size:12px;margin-top:4px">Please double-check: '+res.review.issues.map(x=>esc(x.field)+' — '+esc(x.note)).join('; ')+'</div>';}document.getElementById('sv').innerHTML=msg;const me=await api('me');ME=me.supplier;setTimeout(appView,1400);}else{document.getElementById('sv').innerHTML='<span class="err">'+(res.error||'error')+'</span>';}
}
async function loadInbox(){const {inquiries}=await api('inbox');const el=document.getElementById('inbox');
  if(!inquiries||!inquiries.length){el.innerHTML='<div class="muted">No inquiries yet. You will be notified when a matching request comes in.</div>';return;}
  function boqHtml(i){var parts='';if(i.drawing_file_name){parts+='<div class="muted" style="font-size:12px;margin:4px 0">📐 Customer drawing: '+esc(i.drawing_file_name)+(i.drawing_file_url?(' · <a href="'+i.drawing_file_url+'" target="_blank" rel="noopener">view / download</a>'):'')+'</div>';}var b=i.boq;if(b&&b.boq&&b.boq.length){parts+='<div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:8px;margin:6px 0"><div style="font-weight:600;font-size:13px">🤖 Draft bill of quantities from the customer drawing</div><div class="muted" style="font-size:11px;margin:2px 0 6px">These quantities are AI-estimated from the drawing and are NOT verified — please double-check all measurements and quantities yourself before quoting.'+(i.boq_confidence?(' (AI confidence: '+esc(i.boq_confidence)+')'):'')+'</div><div style="overflow:auto"><table style="width:100%;border-collapse:collapse;font-size:12px"><tr><th style="text-align:left;border-bottom:1px solid #fde68a;padding:3px 5px">Section</th><th style="text-align:left;border-bottom:1px solid #fde68a;padding:3px 5px">Item</th><th style="text-align:right;border-bottom:1px solid #fde68a;padding:3px 5px">Qty</th><th style="text-align:left;border-bottom:1px solid #fde68a;padding:3px 5px">Unit</th></tr>'+b.boq.map(function(it){return '<tr><td style="border-bottom:1px solid #fef3c7;padding:3px 5px">'+esc(it.section||'')+'</td><td style="border-bottom:1px solid #fef3c7;padding:3px 5px">'+esc(it.description||'')+'</td><td style="border-bottom:1px solid #fef3c7;padding:3px 5px;text-align:right">'+(it.qty==null?'—':esc(String(it.qty)))+'</td><td style="border-bottom:1px solid #fef3c7;padding:3px 5px">'+esc(it.unit||'')+'</td></tr>';}).join('')+'</table></div>'+((b.assumptions&&b.assumptions.length)?('<div class="muted" style="font-size:11px;margin-top:4px"><b>AI assumptions:</b> '+esc(b.assumptions.join('; '))+'</div>'):'')+'</div>';}else if(i.drawing_file_name){parts+='<div class="muted" style="font-size:11px;margin:4px 0">The customer attached a drawing (no automatic BOQ) — please review it before quoting.</div>';}return parts;}
el.innerHTML=inquiries.map(i=>{const spec=i.spec&&typeof i.spec==='object'?Object.entries(i.spec).filter(([k])=>!k.startsWith('_')).map(([k,val])=>`<span class="pill">${k.replace(/_/g,' ')}: ${val}</span>`).join(''):'';const q=i.quote;
    return `<div class="inq"><b>${i.category} inquiry</b> <span class="muted">· ${i.emirate||''}</span><div class="muted">${i.summary||''}</div><div style="margin:6px 0">${spec}</div>${boqHtml(i)}${q?`<div class="ok">Quoted AED ${Number(q.quote_amount).toLocaleString()} <span class="muted">— you receive the full amount</span></div>`:`<div style="margin-top:6px"><div style="background:#f0fdfa;border:1px solid #99f6e4;border-radius:8px;padding:8px;margin-bottom:8px"><div style="font-weight:600;font-size:13px">Have a quotation ready? We will anonymize it.</div><div class="muted" style="font-size:11px;margin:2px 0 6px">Paste your quote text or attach a PDF or photo — the app removes your company name, logo, contact and any brand/model names that could identify you, fills the fields below, and keeps your original file locked until the customer reveals you.</div><textarea id="qpaste_${i.id}" placeholder="Paste your quotation text here…" rows="3" style="width:100%"></textarea><div class="row" style="margin-top:6px"><input type="file" id="qimg_${i.id}" accept="image/*,application/pdf" style="flex:1"><button class="gray" data-anon="${i.id}">Anonymize &amp; fill</button></div><div id="anonmsg_${i.id}" class="muted" style="font-size:11px;margin-top:4px"></div></div><div class="row"><input type="number" id="qa_${i.id}" placeholder="Price AED *" style="width:130px"><input id="qlt_${i.id}" placeholder="Delivery / install time" style="flex:1"></div><div class="row" style="margin-top:6px"><input id="qval_${i.id}" placeholder="Valid for (e.g. 30 days)" style="flex:1"><input id="qwar_${i.id}" placeholder="Warranty" style="flex:1"></div><input id="qpay_${i.id}" placeholder="Payment terms (e.g. 50% advance)" style="width:100%;margin-top:6px"><textarea id="qsc_${i.id}" placeholder="Scope / what is included" rows="2" style="width:100%;margin-top:6px"></textarea><textarea id="qcon_${i.id}" placeholder="Conditions / notes (e.g. price subject to site visit)" rows="2" style="width:100%;margin-top:6px"></textarea><div class="muted" style="font-size:11px;margin:4px 0">Do not include your company name or contact — you stay anonymous until the customer reveals you.</div><button data-i="${i.id}">Submit quotation</button></div>`}</div>`;}).join('');
  el.querySelectorAll('button[data-anon]').forEach(b=>b.onclick=async()=>{const id=b.dataset.anon;const txt=document.getElementById('qpaste_'+id).value.trim();const f=document.getElementById('qimg_'+id).files[0];const msg=document.getElementById('anonmsg_'+id);if(!txt&&!f){alert('Paste your quotation or choose an image.');return;}b.disabled=true;msg.textContent='Anonymizing…';let images=[];let original=null;if(f){if(f.size>10485760){alert('File too large (max 10MB).');b.disabled=false;msg.textContent='';return;}const full=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(String(fr.result));fr.readAsDataURL(f);});const data=full.split(',')[1];original={mime:f.type,filename:f.name,b64:data};if(f.type==='application/pdf'){msg.textContent='Reading PDF…';try{images=await window.pdfToImages(data);}catch(e){images=[];}}else{images=[{mime:f.type,data}];}}let res;if(images.length){res=await api('extract_quote',{inquiry_id:id,images,original});}else{res=await aiQuote({text:txt});}b.disabled=false;if(res.error){msg.innerHTML='<span class="err">'+res.error+'</span>';return;}const q=res.quote||res.proposal||{};const set=(x,v)=>{const e=document.getElementById(x+id);if(e&&v!=null)e.value=v;};set('qa_',q.price!=null?q.price:q.amount);set('qlt_',q.lead_time);set('qval_',q.validity);set('qpay_',q.payment_terms);set('qwar_',q.warranty);set('qsc_',q.scope||q.description_anonymized);const cond=[q.conditions,q.exclusions?('Excludes: '+q.exclusions):'',q.notes].filter(Boolean).join('  ');set('qcon_',cond);const masked=(res.masked_terms&&res.masked_terms.length?res.masked_terms:(res.removed||[]));window.__qmeta=window.__qmeta||{};window.__qmeta[id]={source:original?'upload':'form',original_file_path:res.original_file_path||null,original_file_name:res.original_file_name||(original&&original.filename)||null,masked_terms:masked.length?masked:null};msg.innerHTML='<span class="ok">✓ Anonymized'+(original?' — your original file is stored and stays hidden until the customer reveals you':'')+'.</span> Hidden from the customer: '+(masked.length?masked.join(', '):'nothing identifying')+'. Review, then submit.';});
  el.querySelectorAll('button[data-i]').forEach(b=>b.onclick=async()=>{const id=b.dataset.i;const g=x=>{const e=document.getElementById(x+id);return e?e.value:'';};const amt=parseFloat(document.getElementById('qa_'+id).value);if(!amt){alert('Enter a price');return;}const _m=(window.__qmeta&&window.__qmeta[id])||{};const res=await api('submit_quote',{inquiry_id:id,amount:amt,lead_time:g('qlt_'),validity:g('qval_'),payment_terms:g('qpay_'),warranty:g('qwar_'),scope:g('qsc_'),conditions:g('qcon_'),source:_m.source||'form',original_file_path:_m.original_file_path||null,original_file_name:_m.original_file_name||null,masked_terms:_m.masked_terms||null});if(res.error){alert(res.error)}else{loadInbox();}});
}
async function loadProjects(){const r=await api('projects');const el=document.getElementById('projects');if(!el)return;const projects=r.projects;if(!projects||!projects.length){el.innerHTML='<div class="muted">No completed projects yet. Won jobs will appear here as your track record customers can see.</div>';return;}el.innerHTML=projects.map(p=>'<div style="font-size:13px;border-top:1px solid #eef0f2;padding:5px 0"><b>'+esc(p.category||'')+'</b> · '+esc(p.emirate||'')+' · '+esc(p.month||'')+' · AED '+Number(p.amount||0).toLocaleString()+(p.summary?' <span class="muted">— '+esc(p.summary)+'</span>':'')+'</div>').join('');}
</script></body></html>
