document.getElementById('dfile').onchange=async function(e){var f=e.target.files&&e.target.files[0];if(!f)return;if(f.size>25*1024*1024){alert('Drawing must be under 25 MB.');return;}var dataUrl=await new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result);};r.readAsDataURL(f);});var b64=String(dataUrl).split(',')[1];var mime=f.type||'application/octet-stream';var nm=(f.name||'drawing').toLowerCase();var box=document.getElementById('drawingbox');var images=[];try{if(mime==='application/pdf'||nm.endsWith('.pdf')){box.innerHTML='<div class="muted">Reading drawing pages…</div>';images=await window.pdfToImages(b64);}else if(/^image\//.test(mime)||/\.(png|jpe?g|webp)$/.test(nm)){images=[{mime:mime,data:b64}];}}catch(err){images=[];}var iscad=/\.(dwg|dxf)$/.test(nm)||/dwg|dxf/.test(mime);var willAnalyze=images.length>0||iscad;box.innerHTML='<div class="ai">📐 <b>'+esc(f.name)+'</b> attached.'+(willAnalyze?(iscad?' Converting your CAD file and generating a draft bill of quantities… <span class="muted">this can take up to ~3 minutes — please wait.</span>':' Generating a draft bill of quantities… <span class="muted">this can take up to ~2 minutes — please wait.</span>'):' <span class="muted">This file type cannot be auto-read for a BOQ; it will be attached to your request as-is.</span>')+'</div>';var hint=document.getElementById('need').value.trim().slice(0,400);var res;try{res=await api('analyze_drawing',{images:images,original_b64:b64,mime:mime,drawing_file_name:f.name,hint:hint});}catch(err){res=null;}if(!res||(res.error&&!res.drawing_file_path&&!res.boq)){box.innerHTML='<div class="q miss"><span class="err">Could not process the drawing. You can still continue without it.</span></div>';DRAWING=null;return;}DRAWING={drawing_file_path:res.drawing_file_path||null,drawing_file_name:res.drawing_file_name||f.name,boq:res.boq||null};renderBOQ();};

document.getElementById('qfile').onchange=async function(e){var f=e.target.files&&e.target.files[0];if(!f)return;if(f.size>25*1024*1024){alert('File must be under 25 MB.');return;}var dataUrl=await new Promise(function(res){var r=new FileReader();r.onload=function(){res(r.result);};r.readAsDataURL(f);});var b64=String(dataUrl).split(',')[1];var mime=f.type||'application/octet-stream';var nm=(f.name||'quotation').toLowerCase();var box=document.getElementById('drawingbox');var images=[];try{if(mime==='application/pdf'||nm.endsWith('.pdf')){box.innerHTML='<div class="muted">Reading your quotation…</div>';images=await window.pdfToImages(b64);}else if(/^image\//.test(mime)||/\.(png|jpe?g|webp)$/.test(nm)){images=[{mime:mime,data:b64}];}}catch(err){images=[];}if(!images.length){box.innerHTML='<div class="q miss"><span class="err">Could not read that file. Please attach a clear PDF or photo of the quotation.</span></div>';return;}box.innerHTML='<div class="ai">🧾 <b>'+esc(f.name)+'</b> attached. Reading and anonymizing (removing contact details, prices and brand names)… <span class="muted">this can take up to ~2 minutes — please wait.</span></div>';var hint=document.getElementById('need').value.trim().slice(0,400);var res;try{res=await api('analyze_quotation',{images:images,original_b64:b64,mime:mime,file_name:f.name,hint:hint});}catch(err){res=null;}if(!res||(res.error&&!res.scope)){box.innerHTML='<div class="q miss"><span class="err">Could not process the quotation. You can still continue without it.</span></div>';DRAWING=null;return;}DRAWING={drawing_file_path:res.drawing_file_path||null,drawing_file_name:res.drawing_file_name||f.name,boq:res.scope||null,brief_source:'quotation'};renderBOQ();};
document.getElementById('go').onclick=goAI;
}
async function goAI(){
  const text=document.getElementById('need').value.trim();const em=document.getElementById('em').value;
  if(text.length<6 && !FILES.length){alert('Please describe what you need, or add a photo.');return;}
  document.getElementById('m1').textContent='AI is reading your request…';
  let res=null;
  try{res=await aiAnalyze({text,emirate:em||null,images:FILES.map(f=>({mime:f.mime,data:f.data}))});}catch(e){res={fallback:true};}
  // fallback to keyword detect if AI unavailable
  if(!res||res.fallback||!res.category){
    document.getElementById('m1').textContent='';
    const d=await api('detect',{text});const cat=d.category;
    if(!cat){document.getElementById('m1').innerHTML='<span class="err">Could not understand the job yet — add a bit more detail or a photo, or pick a category below.</span>';return chooseCategory(text,em);}
    const sp=SPECS.find(s=>s.category===cat);DRAFT={category:cat,label:sp?sp.label:cat,emirate:em||d.emirate||'',raw:text,fields:sp?sp.fields:[],spec:{},missingKeys:[],ai:false};
    return stage2();
  }
  document.getElementById('m1').textContent='';
  const qs=(res.missing||[]).map(m=>({key:m.key,question:m.question,type:m.type||'text',options:Array.isArray(m.options)?m.options:[],required:m.required!==false}));DRAFT={category:res.category,label:res.label||res.category,emirate:res.emirate||em||'',raw:text,fields:qs,spec:res.spec||{},missingKeys:qs.filter(x=>x.required).map(x=>x.key),scope_type:res.scope_type||'single',trades:Array.isArray(res.trades)?res.trades:[],summary:res.summary||'',notes:res.notes||'',confidence:res.confidence,ai:true};
  stage2();
}
function chooseCategory(text,em){
  const st=document.getElementById('stage2');
  st.innerHTML=`<div class="card"><div class="step">Pick the category</div><div class="q"><select id="pc"><option value="">Choose…</option>${SPECS.map(s=>`<option value="${s.category}">${s.label}</option>`).join('')}</select></div><div class="row"><button id="pcgo">Continue</button></div></div>`;
  document.getElementById('pcgo').onclick=()=>{const cat=document.getElementById('pc').value;if(!cat)return;const sp=SPECS.find(s=>s.category===cat);DRAFT={category:cat,label:sp.label,emirate:em||'',raw:text,fields:sp.fields,spec:{},missingKeys:[],ai:false};stage2();};
}
function stage2(){const st=document.getElementById('stage2');const f=DRAFT.fields||[];const sp=DRAFT.spec||{};const miss=new Set(DRAFT.missingKeys||[]);
  const val=k=>{const x=sp[k];return x==null?'':String(x);};
  const render1=x=>{const id='sf_'+x.key;const mc=miss.has(x.key)?' miss':'';const lbl=`<label>${esc(x.question)} ${x.required?'<span class="req">*</span>':''}</label>`;
    if(x.type==='select'){const cur=val(x.key);return `<div class="q${mc}">${lbl}<select id="${id}"><option value="">Choose…</option>${(x.options||[]).map(o=>`<option ${cur===o||(!cur&&x.default===o)?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;}
    if(x.type==='multiselect')return `<div class="q${mc}">${lbl}<div id="${id}">${(x.options||[]).map(o=>`<label style="display:inline-flex;align-items:center;gap:6px;margin:2px 10px 2px 0;font-weight:400"><input type="checkbox" value="${esc(o)}"> ${esc(o)}</label>`).join('')}</div></div>`;if(x.type==='number')return `<div class="q${mc}">${lbl}<input id="${id}" type="number" inputmode="decimal" value="${esc(val(x.key))}" placeholder="${esc(x.help||'')}"></div>`;
    return `<div class="q${mc}">${lbl}<input id="${id}" value="${esc(val(x.key))}" placeholder="${esc(x.help||'')}"></div>`;};
  const reqs=f.filter(x=>x.required),opts=f.filter(x=>!x.required);
  st.innerHTML=`<div class="card"><div class="step">2 · ${esc(DRAFT.label)} ${DRAFT.ai?'— AI filled what it understood; check &amp; complete the highlighted items':'— a few details so suppliers can quote'}</div>
   ${DRAFT.ai&&DRAFT.summary?`<div class="ai">🤖 <b>Understood:</b> ${esc(DRAFT.summary)}${DRAFT.notes?'<br><span class="muted">'+esc(DRAFT.notes)+'</span>':''}</div>`:''}
   <div class="grid" style="margin-top:10px"><div class="q"><label>Emirate <span class="req">*</span></label><select id="em2"><option value="">Choose…</option>${EMIRATES.map(e=>`<option ${DRAFT.emirate===e?'selected':''}>${e}</option>`).join('')}</select></div></div>
   <div class="q"><label>Approximate budget <span class="muted" style="font-weight:400">(optional)</span></label><select id="budget_sel"><option value="">Choose…</option>${['Under AED 5,000','AED 5,000–15,000','AED 15,000–50,000','AED 50,000–150,000','AED 150,000+','Not sure / prefer not to say'].map(b=>`<option>${b}</option>`).join('')}</select></div>${reqs.map(render1).join('')}
   ${opts.length?`<details ${DRAFT.ai?'open':''}><summary class="muted" style="cursor:pointer;margin:8px 0">More details (better quotes)</summary>${opts.map(render1).join('')}</details>`:''}
   <div class="row"><button id="send2">Send to matched suppliers</button><span id="m2" class="muted"></span></div>
   <div class="muted" style="margin-top:8px">Your identity stays private. Suppliers only see the request details.</div></div>`;
  document.getElementById('send2').onclick=async()=>{
    const spec=Object.assign({},DRAFT.spec||{});let missing=null;
    for(const x of DRAFT.fields){if(x.type==='multiselect'){const box=document.getElementById('sf_'+x.key);const vals=box?[...box.querySelectorAll('input:checked')].map(c=>c.value):[];if(x.required&&!vals.length){missing=x;if(box)box.scrollIntoView();break;}if(vals.length)spec[x.key]=vals.join(', ');continue;}const el=document.getElementById('sf_'+x.key);if(!el)continue;const v=el.value.trim();if(x.required&&!v){missing=x;el.focus();break;}if(v)spec[x.key]=v;}
    if(missing){alert('Please answer: '+missing.question);return;}
    const emirate=document.getElementById('em2').value;if(!emirate){alert('Please choose your emirate.');document.getElementById('em2').focus();return;}
    const budget=(document.getElementById('budget_sel')||{}).value||'';document.getElementById('m2').textContent='Sending…';
    const summary=DRAFT.summary||(DRAFT.label+' — '+Object.values(spec).slice(0,5).join(', ')+' ('+emirate+')');
    const res=await api('create_inquiry',{category:DRAFT.category,emirate,raw_input:DRAFT.raw,spec,summary,budget,scope_type:DRAFT.scope_type||'single',trades:DRAFT.trades||[],drawing:DRAWING});
    if(res.error){document.getElementById('m2').innerHTML='<span class="err">'+res.error+'</span>';return;}
    st.innerHTML=`<div class="card"><div class="step">Request sent ✓</div><div>Sent to <b>${res.matches}</b> matched suppliers in ${emirate}.</div><div class="muted" style="margin-top:6px">Quotes appear in <b>My requests</b>. You stay anonymous until you accept one.</div><div class="row"><button id="seeMine">View my requests</button></div></div>`;
    document.getElementById('seeMine').onclick=()=>mainView('mine');};
}
async function mineView(){const v=document.getElementById('view');v.innerHTML='<div class="card muted">Loading…</div>';
  const r=await api('my_inquiries');const inquiries=r.inquiries;
  if(!inquiries||!inquiries.length){v.innerHTML='<div class="card"><div class="muted">No requests yet. Create your first one in <b>New request</b>.</div></div>';return;}
  const money=n=>'AED '+Number(n||0).toLocaleString();const QDET={};
  v.innerHTML=inquiries.map(i=>{const date=new Date(i.created_at).toLocaleDateString();
    const qs=(i.quotes||[]).map(q=>{const meta=`${q.verified?'<span class="badge ok">verified</span> ':''}${q.rating?`<span class="star">★</span> ${Number(q.rating).toFixed(1)}${q.rating_count?` (${q.rating_count} ${q.rating_source==='QuotesDone'?'QuotesDone':'Google'})`:''} · `:''}${q.emirate||''}`;
      const price=`<div class="price">${money(q.price)}</div>`;
      if(q.revealed)return `<div class="qt"><div><b>${q.label}</b> <span class="muted">${meta}</span>${q.has_original?'<span class="muted" style="font-size:12px" title="Supplier attached their original quotation — unlocked after you reveal">📎 original </span>':''}<a href="#" class="muted" data-detail="${q.id}" style="font-size:12px">View full quotation</a></div><div style="text-align:right">${price}<button class="gray" data-show="${q.id}" style="padding:6px 12px;font-size:13px">Show contact</button> <a href="#" class="muted" data-refund="${q.id}" style="font-size:12px;display:inline-block;margin-top:4px">Request refund</a> <a href="#" class="muted" data-hist="${q.id}" style="font-size:12px">Past projects</a> ${q.rated?'<span class="muted" style="font-size:12px">✓ Rated</span>':`<a href="#" class="muted" data-rate="${q.id}" style="font-size:12px">Rate</a>`}</div></div>`;
      return `<div class="qt"><div><b>${q.label}</b> <span class="muted">${meta}</span>${q.has_original?'<span class="muted" style="font-size:12px" title="Supplier attached their original quotation — unlocked after you reveal">📎 original </span>':''}<a href="#" class="muted" data-detail="${q.id}" style="font-size:12px">View full quotation</a></div><div style="text-align:right">${price}<button data-r="${q.id}">Reveal · ${money(q.reveal_fee)}</button></div></div>`;}).join('');
    return `<div class="inq"><b>${esc(i.summary||i.category)}</b> <span class="muted">· ${date}</span> <span class="badge ${i.status==='revealed'?'ok':''}">${i.status}</span>${i.drawing_file_name?('<div class="ai" style="margin-top:6px">📐 Drawing: '+esc(i.drawing_file_name)+(i.drawing_file_url?(' · <a href="'+i.drawing_file_url+'" target="_blank" rel="noopener">download</a>'):'')+(i.boq&&i.boq.boq&&i.boq.boq.length?(' · <span class="muted">draft BOQ '+i.boq.boq.length+' items'+(i.boq_confidence?(' ('+esc(i.boq_confidence)+' confidence)'):'')+'</span>'):'')+'</div>'):''}${qs||'<div class="muted" style="margin-top:6px">Waiting for quotes…</div>'}<div class="contactbox" id="c_${i.id}"></div></div>`;}).join('');
  function showContact(box,s,fileUrl,fileName){box.innerHTML=`<div class="contact"><b>${esc(s.company_name||'')}</b><br>${s.phone?`📞 <a href="tel:${esc(s.phone)}">${esc(s.phone)}</a><br>`:''}${s.whatsapp?`💬 <a href="https://wa.me/${esc(String(s.whatsapp).replace(/[^0-9]/g,''))}" target="_blank">WhatsApp</a><br>`:''}${s.email?`✉️ <a href="mailto:${esc(s.email)}">${esc(s.email)}</a><br>`:''}${s.website?`🌐 <a href="${esc(s.website)}" target="_blank">Website</a>`:''}${fileUrl?`<br>📄 <a href="${fileUrl}" target="_blank" rel="noopener">Download supplier's original quotation${fileName?(' — '+esc(fileName)):''}</a>`:''}<div class="muted" style="margin-top:6px">You can now contact them directly. You pay the supplier their quoted price — the reveal fee is already paid.</div></div>`;}
  v.querySelectorAll('button[data-r]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;const q=await api('reveal',{quote_id:b.dataset.r});b.disabled=false;
    if(q.error){alert(q.error);return;}
    const box=b.closest('.inq').querySelector('.contactbox');
    if(q.already_revealed){showContact(box,q.supplier||{});return;}
    const fee=money(q.reveal_fee);
    box.innerHTML=`<div class="contact"><div style="font-weight:700;margin-bottom:2px">Unlock this supplier's contact</div><div class="muted" style="font-size:13px">One-time reveal fee: <b>${fee}</b>. Refundable within 3 working days if they don't respond.</div><div class="row" style="margin-top:10px;gap:8px;flex-wrap:wrap"><button data-pay="apple" style="background:#000">Apple Pay</button><button data-pay="google" style="background:#1a73e8">Google Pay</button><button data-pay="card" class="gray">Card</button></div><div class="muted" id="paymsg" style="font-size:12px;margin-top:6px"></div></div>`;
    box.querySelectorAll('button[data-pay]').forEach(pb=>pb.onclick=async()=>{
      box.querySelectorAll('button[data-pay]').forEach(x=>x.disabled=true);
      box.querySelector('#paymsg').textContent='Processing payment…';
      const res=await api('confirm_reveal',{quote_id:b.dataset.r,payment_ref:'STUB-'+pb.dataset.pay+'-'+Date.now()});
      if(res.error){box.querySelector('#paymsg').textContent=res.error;box.querySelectorAll('button[data-pay]').forEach(x=>x.disabled=false);return;}
      showContact(box,res.supplier||{},res.original_file_url,res.original_file_name);});});
  v.querySelectorAll('button[data-show]').forEach(b=>b.onclick=async()=>{
    const res=await api('reveal',{quote_id:b.dataset.show});showContact(b.closest('.inq').querySelector('.contactbox'),res.supplier||{},res.original_file_url,res.original_file_name);});
  v.querySelectorAll('a[data-refund]').forEach(a=>a.onclick=async(e)=>{e.preventDefault();
    if(!confirm('Request a refund of the reveal fee? Use this if the supplier has not responded.'))return;
    const res=await api('request_refund',{quote_id:a.dataset.refund});alert(res.error||res.note||'Refund requested.');});
  v.querySelectorAll('a[data-hist]').forEach(a=>a.onclick=async(e)=>{e.preventDefault();const box=a.closest('.inq').querySelector('.contactbox');box.innerHTML='<div class="muted">Loading projects…</div>';const res=await api('supplier_history',{quote_id:a.dataset.hist});if(res.error){box.innerHTML='<span class="err">'+res.error+'</span>';return;}const s=res.supplier||{};const rd=s.rating_display||{};box.innerHTML='<div class="contact"><b>'+esc(s.company_name||'')+'</b> '+(rd.value?'<span class="star">★</span> '+rd.value+' ('+rd.count+' '+rd.source+')':'')+'<div class="muted" style="margin:6px 0">'+(res.projects_count||0)+' completed project(s) on QuotesDone</div>'+(res.projects||[]).map(pr=>'<div style="font-size:13px;border-top:1px solid #eee;padding:4px 0">'+esc(pr.category||'')+' · '+esc(pr.emirate||'')+' · '+esc(pr.month||'')+' · '+esc(pr.value_band||'')+'</div>').join('')+'</div>';});
  v.querySelectorAll('a[data-rate]').forEach(a=>a.onclick=(e)=>{e.preventDefault();const box=a.closest('.inq').querySelector('.contactbox');box.innerHTML='<div class="contact"><div style="font-weight:700">Rate this supplier</div><div style="font-size:26px;cursor:pointer" id="stars">'+[1,2,3,4,5].map(n=>'<span data-star="'+n+'">☆</span>').join(' ')+'</div><div class="muted" id="ratemsg" style="font-size:12px"></div></div>';box.querySelectorAll('[data-star]').forEach(st=>{st.onmouseover=()=>{const n=Number(st.dataset.star);box.querySelectorAll('[data-star]').forEach(x=>x.textContent=Number(x.dataset.star)<=n?'★':'☆');};st.onclick=async()=>{const n=Number(st.dataset.star);const c=prompt('Optional comment about this supplier:')||'';box.querySelector('#ratemsg').textContent='Saving…';const res=await api('rate_supplier',{quote_id:a.dataset.rate,rating:n,comment:c});box.querySelector('#ratemsg').innerHTML=res.error?'<span class="err">'+res.error+'</span>':'<span class="ok">✓ Thanks for rating!</span>';};});});
  v.querySelectorAll('a[data-detail]').forEach(a=>a.onclick=(e)=>{e.preventDefault();const q=QDET[a.dataset.detail]||{};const box=a.closest('.inq').querySelector('.contactbox');box.innerHTML='<div class="contact"><div style="font-weight:700;margin-bottom:4px">Quotation — '+esc(q.label||'Supplier')+'</div><table style="font-size:13px;width:100%">'+[['Price','AED '+Number(q.price||0).toLocaleString()],['Delivery / install',q.lead_time],['Valid for',q.validity],['Payment terms',q.payment_terms],['Warranty',q.warranty],['Scope / included',q.scope],['Conditions',q.conditions],['Notes',q.notes]].filter(r=>r[1]).map(r=>'<tr><td class="muted" style="vertical-align:top;padding-right:10px;white-space:nowrap">'+r[0]+'</td><td>'+esc(r[1])+'</td></tr>').join('')+'</table><div class="muted" style="font-size:11px;margin-top:6px">Company name & contact stay hidden until you reveal.</div></div>';});
}
