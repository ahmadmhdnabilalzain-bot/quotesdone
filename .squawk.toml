# Squawk — lints Postgres migrations for operations that take locks and cause downtime.
#
# ── WHAT IS LINTED, AND WHAT DELIBERATELY IS NOT ────────────────────────────────────────────────
# Squawk's rules are about running DDL against a database that has live traffic: an index built
# without CONCURRENTLY blocks writes, a new NOT NULL column rewrites the table, a unique constraint
# takes an exclusive lock. Every one of those is a statement about readers and writers being there
# at the time.
#
# The two generated files in supabase/migrations/ are excluded because neither ever meets live
# traffic. They run against an EMPTY database — that is their entire purpose, and the Supabase
# Preview check builds one from them on every commit. Linting them produced 942 warnings about
# blocking writers on tables that do not yet exist and have no writers, which is not a finding.
# Leaving that noise in would have made the linter something people mute rather than read.
#
# The value here is prospective. The next migration written by hand against production IS live
# traffic, and that is the one this catches.
# ONE PATTERN, MATCHED THE SAME WAY IN CI. The generated files are the only ones carrying
# `_baseline_` in their name, so the workflow filters on that same token rather than repeating two
# filenames that would drift apart the first time either is renamed.
excluded_paths = [
  "supabase/migrations/*_baseline_*.sql",
  # The archived history, applied by nothing. See supabase/migrations_history/README.md.
  "supabase/migrations_history/*",
]

# ── ONE RULE OFF, WITH ITS REASON ──────────────────────────────────────────────────────────────
# prefer-robust-stmts wants every migration wrapped so it can be re-run after a partial failure.
# This repo achieves the same end differently and more strictly: statements are written IF NOT
# EXISTS / guarded on catalog lookups, and scripts/apply_sql.mjs re-reads the deployed definition
# and asserts an md5 match on both projects afterwards. A transaction would not add to that, and
# several legitimate statements here (CREATE INDEX CONCURRENTLY, ALTER TYPE ... ADD VALUE) cannot
# run inside one at all.
excluded_rules = ["prefer-robust-stmts"]
